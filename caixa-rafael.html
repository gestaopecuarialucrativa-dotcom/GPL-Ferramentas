<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caixa Semanal — Rafael</title>
<style>
:root{
  --v:#1B5E20; --v2:#2E7D32; --v3:#4CAF50;
  --bg:#eef2ec; --card:#fff; --line:#e0e7e0;
  --text:#1b2c1b; --fraco:#65766a;
  --red:#e53935; --red-bg:#fce4ec;
  --warn:#FF6F00; --warn-bg:#fff8e1;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,'Segoe UI',Roboto,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;padding-bottom:60px}

/* TOPBAR */
.topbar{background:var(--v);padding:11px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.topbar-brand{display:flex;align-items:center;gap:10px}
.topbar-logo{height:44px;display:flex;align-items:center;justify-content:center}
.topbar-logo img{height:44px;width:auto;display:block}
.topbar-title{color:#fff;font-size:15px;font-weight:700;line-height:1.2}
.topbar-sub{color:#a5d6a7;font-size:10px}
.selo-leitura{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:11px;font-weight:700;padding:6px 12px;border-radius:20px;display:flex;align-items:center;gap:5px}
.selo-leitura svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--v3);display:inline-block;margin-right:5px}
.sync-dot.sincronizando{background:#FFD54F;animation:pulse .8s infinite alternate}
.sync-dot.erro{background:#ef9a9a}
@keyframes pulse{from{opacity:.4}to{opacity:1}}

.container{max-width:1100px;margin:0 auto;padding:20px 16px}

/* SALDO GERAL */
.saldo-geral{background:var(--v);border-radius:var(--radius);padding:16px 20px;margin-bottom:20px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.sg-item{flex:1;min-width:110px}
.sg-label{font-size:10px;color:#a5d6a7;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.sg-val{font-size:20px;font-weight:700;color:#fff}
.sg-val.neg{color:#ef9a9a}.sg-val.pos{color:#a5d6a7}
.sg-div{width:1px;background:rgba(255,255,255,.2);align-self:stretch;min-height:36px}

/* GRID */
.semanas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}

/* CARD */
.semana-card{background:var(--card);border-radius:var(--radius);border-left:4px solid var(--v2);box-shadow:0 1px 6px rgba(0,0,0,.08);overflow:hidden;display:flex;flex-direction:column}
.semana-card.negativa{border-left-color:var(--red)}
.semana-card.zerada{border-left-color:var(--warn)}
.semana-header{background:var(--v);padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.semana-data{color:#fff;font-size:15px;font-weight:700}

/* ITENS */
.itens-lista{padding:6px 0;flex:1}
.item-row{display:flex;align-items:center;gap:8px;padding:6px 14px;border-bottom:1px solid #f5f5f5}
.item-row:last-child{border-bottom:none}
.item-row.repor{background:#fff8e1}
.item-ico{width:16px;height:16px;flex-shrink:0}
.item-ico svg{width:16px;height:16px;stroke:var(--v2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.item-row.repor .item-ico svg{stroke:var(--warn)}
.item-corpo{flex:1;min-width:0}
.item-desc{font-size:12px;color:var(--text);line-height:1.3}
.item-data-tag{font-size:10px;color:var(--fraco);margin-top:1px}
.item-val{font-size:12px;font-weight:700;color:var(--red);white-space:nowrap}
.item-row.repor .item-val{color:var(--warn)}

/* FOOTER */
.semana-footer{border-top:2px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:3px;background:#fafdf9}
.footer-row{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.footer-label{color:var(--fraco)}
.footer-val{font-weight:700}
.c-verde{color:var(--v2)}.c-red{color:var(--red)}.c-warn{color:var(--warn)}.c-preto{color:var(--text)}
.dep-linha{display:flex;justify-content:space-between;font-size:11px;color:var(--fraco);padding:1px 0}
.dep-linha .dep-d{color:var(--fraco)}
.dep-linha .dep-v{color:var(--v2);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:20px;font-size:10px;font-weight:700;margin-top:5px;width:fit-content}
.pill svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill-ok{background:#e8f5e9;color:var(--v2)}
.pill-neg{background:var(--red-bg);color:var(--red)}
.pill-warn{background:var(--warn-bg);color:var(--warn)}

/* EMPTY / LOADING */
.empty-state{text-align:center;padding:60px 20px;color:var(--fraco);grid-column:1/-1}
.empty-state svg{width:52px;height:52px;stroke:#b0bfb0;margin-bottom:12px;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.empty-state h3{font-size:15px;color:#888;margin-bottom:6px}
.loading{text-align:center;padding:50px 20px;color:var(--fraco);grid-column:1/-1;font-size:13px}

@media(max-width:480px){
  .saldo-geral{padding:12px 14px;gap:10px}
  .sg-val{font-size:16px}
  .semanas-grid{grid-template-columns:1fr}
}
</style>
</head>

function isoParaExibicao(iso){ if(!iso)return''; var p=String(iso).split('-'); return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso; }
function isoParaCurto(iso){ if(!iso)return''; var p=String(iso).split('-'); return p.length===3?p[2]+'/'+p[1]:iso; }
function exibicaoParaISO(str){ if(!str)return''; var p=String(str).split('/'); if(p.length===3)return p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0'); return str; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

var ICO_SACO='<svg viewBox="0 0 24 24"><path d="M6 2l1.5 3h9L18 2M4 8h16l-1.5 12a2 2 0 01-2 1.8H7.5a2 2 0 01-2-1.8L4 8z"/></svg>';
var ICO_REPOR='<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-3-6.7L21 8"/><polyline points="21 3 21 8 16 8"/></svg>';
var ICO_CHECK='<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
var ICO_ALERTA='<svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
var ICO_MENOS='<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg>';

// ── CÁLCULO (idêntico à página do Rogério) ──
function calcularSemanas(){
  estado.semanas.sort(function(a,b){
    var da=a.dataISO||exibicaoParaISO(a.data||''), db=b.dataISO||exibicaoParaISO(b.data||'');
    return da<db?-1:(da>db?1:0);
  });
  var saldoAcum=0, reporAcum=0;
  estado.semanas.forEach(function(sem){
    var totalItens=(sem.itens||[]).reduce(function(a,it){return a+(parseFloat(it.valor)||0);},0);
    var totalDep=(sem.depositos||[]).reduce(function(a,d){return a+(parseFloat(d.valor)||0);},0);
    sem._reporAnterior=reporAcum;
    var totalDesp=totalItens+reporAcum;
    var saldo=saldoAcum+totalDep-totalDesp;
    sem._totalItens=totalItens; sem._totalDep=totalDep; sem._totalDesp=totalDesp;
    sem._saldoAntes=saldoAcum; sem._saldo=saldo;
    sem._rogerio=saldo<0?Math.abs(saldo):0; sem._falta=saldo<0?Math.abs(saldo):0;
    if(saldo<0){reporAcum=Math.abs(saldo);saldoAcum=0;}else{reporAcum=0;saldoAcum=saldo;}
  });
}

function calcularGeral(){
  var totE=0,totS=0;
  var ativas=estado.semanas.filter(function(s){return !s.validada;});
  ativas.forEach(function(sem){ totE+=sem._totalDep||0; totS+=sem._totalItens||0; });
  var saldoFinal=ativas.length>0?ativas[ativas.length-1]._saldo:0;
  document.getElementById('sg-entradas').textContent=fmtBRL(totE);
  document.getElementById('sg-saidas').textContent=fmtBRL(totS);
  var elS=document.getElementById('sg-saldo');
  elS.textContent=(saldoFinal<0?'− ':'+ ')+fmtBRL(saldoFinal);
  elS.className='sg-val '+(saldoFinal<0?'neg':'pos');
}

function renderTudo(){ calcularSemanas(); calcularGeral(); renderSemanas(); }

function renderSemanas(){
  var grid=document.getElementById('semanasGrid');
  grid.innerHTML='';
  // Rafael vê SÓ as ativas
  var ativas=estado.semanas.filter(function(s){return !s.validada;});
  if(!ativas.length){
    grid.innerHTML='<div class="empty-state"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><h3>Nenhuma semana ativa</h3><p>Aguardando lançamentos</p></div>';
    return;
  }
  ativas.forEach(function(sem){ grid.appendChild(criarCard(sem)); });
}

function criarCard(sem){
  var div=document.createElement('div');
  var temMov=(sem._totalItens>0||sem._totalDep>0||sem._reporAnterior>0);
  var cls=sem._saldo<0?'negativa':(sem._saldo===0&&temMov?'zerada':'');
  div.className='semana-card '+cls;

  div.innerHTML='<div class="semana-header"><span class="semana-data">'+esc(sem.data)+'</span></div>';

  var lista=document.createElement('div');
  lista.className='itens-lista';
  // Linha repor
  if(sem._reporAnterior>0){
    var rep=document.createElement('div');
    rep.className='item-row repor';
    rep.innerHTML='<span class="item-ico">'+ICO_REPOR+'</span><div class="item-corpo"><div class="item-desc">Repor semana anterior</div><div class="item-data-tag">saldo que ficou pendente</div></div><span class="item-val">'+fmtBRL(sem._reporAnterior)+'</span>';
    lista.appendChild(rep);
  }
  (sem.itens||[]).forEach(function(it){
    var partes=[];
    if(it.dataISO)partes.push(isoParaCurto(it.dataISO));
    if(it.obs)partes.push(esc(it.obs));
    var dataTag=partes.length?'<div class="item-data-tag">'+partes.join(' · ')+'</div>':'';
    var row=document.createElement('div');
    row.className='item-row';
    row.innerHTML='<span class="item-ico">'+ICO_SACO+'</span><div class="item-corpo"><div class="item-desc">'+esc(it.desc)+'</div>'+dataTag+'</div><span class="item-val">'+fmtBRL(it.valor)+'</span>';
    lista.appendChild(row);
  });
  if(!sem.itens||!sem.itens.length){
    if(sem._reporAnterior<=0) lista.innerHTML='<div style="padding:9px 14px;font-size:11px;color:#bbb;font-style:italic">Nenhum item ainda</div>';
  }
  div.appendChild(lista);

  // FOOTER
  var footer=document.createElement('div');
  footer.className='semana-footer';
  var saldoCor=sem._saldo>=0?'c-verde':'c-red';
  var pillCls=sem._saldo>0?'pill-ok':(sem._saldo<0?'pill-neg':'pill-warn');
  var pillIco=sem._saldo>0?ICO_CHECK:(sem._saldo<0?ICO_ALERTA:ICO_MENOS);
  var pillTxt=sem._saldo>0?'Positivo':(sem._saldo<0?'Falta repor':'Zerado');

  var h='<div class="footer-row"><span class="footer-label c-preto" style="font-weight:700">Total despesas</span><span class="footer-val c-preto">'+fmtBRL(sem._totalDesp)+'</span></div>';
  h+='<div class="footer-row" style="margin-top:4px"><span class="footer-label c-verde">Depósitos Rafael</span><span class="footer-val c-verde">'+fmtBRL(sem._totalDep)+'</span></div>';
  (sem.depositos||[]).forEach(function(dep){
    if((parseFloat(dep.valor)||0)>0){
      h+='<div class="dep-linha"><span class="dep-d">• '+isoParaCurto(dep.dataISO)+'</span><span class="dep-v">'+fmtBRL(dep.valor)+'</span></div>';
    }
  });
  if(sem._saldoAntes>0)h+='<div class="footer-row" style="font-size:11px;color:#888"><span>Saldo anterior</span><span>'+fmtBRL(sem._saldoAntes)+'</span></div>';
  if(sem._rogerio>0)h+='<div class="footer-row"><span class="footer-label c-warn">Rogério cobriu</span><span class="footer-val c-warn">'+fmtBRL(sem._rogerio)+'</span></div>';
  h+='<div class="footer-row" style="margin-top:4px;padding-top:4px;border-top:1px solid var(--line)"><span class="footer-label">Saldo</span><span class="footer-val '+saldoCor+'">'+(sem._saldo<0?'− ':'')+fmtBRL(Math.abs(sem._saldo))+'</span></div>';
  if(sem._falta>0)h+='<div class="footer-row"><span class="footer-label c-red">Falta repor</span><span class="footer-val c-red">'+fmtBRL(sem._falta)+'</span></div>';
  h+='<span class="pill '+pillCls+'">'+pillIco+pillTxt+'</span>';
  footer.innerHTML=h;
  div.appendChild(footer);

  return div;
}

// ── CARREGAR DO SHEETS (só leitura) ──
function carregarDoSheets(){
  var dot=document.getElementById('sync-dot');
  dot.className='sync-dot sincronizando';
  fetch(SCRIPT_URL+'?acao=listar')
    .then(function(r){return r.json();})
    .then(function(data){
      if(data.ok&&Array.isArray(data.semanas)){
        estado.semanas=data.semanas;
        // Normalizar datas/depositos pra exibição
        estado.semanas.forEach(function(sem){
          if(!sem.dataISO&&sem.data)sem.dataISO=exibicaoParaISO(sem.data);
          if(sem.dataISO)sem.data=isoParaExibicao(sem.dataISO);
          if(!Array.isArray(sem.depositos))sem.depositos=[];
          if(!Array.isArray(sem.itens))sem.itens=[];
        });
        dot.className='sync-dot';
        renderTudo();
      } else { throw new Error(data.msg||'erro'); }
    })
    .catch(function(err){
      dot.className='sync-dot erro';
      document.getElementById('semanasGrid').innerHTML='<div class="empty-state"><h3>Não foi possível carregar</h3><p>Tente atualizar a página</p></div>';
      console.warn(err.message);
    });
}

carregarDoSheets();
// Atualiza sozinho a cada 60s (pra Rafael ver mudanças que Rogério fizer)
setInterval(carregarDoSheets, 60000);
</script>
