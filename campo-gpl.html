<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1B5E20">
<title>Anotar no campo · GPL</title>
<meta name="google" content="notranslate">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="icone-caixa-gpl.png">
<link rel="icon" type="image/png" href="icone-caixa-gpl.png">
<style>
:root{--v1:#1B5E20;--v2:#2E7D32;--v3:#4CAF50;--v7:#E8F5E9;--bg:#f3f6f2;--line:#e6ebe5;--ink:#16261a;--muted:#7a8a7e;--warn:#8a5a00;--danger:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}
/* cabeçalho no padrão novo (Raio-X) */
.top{background:linear-gradient(140deg,#123d1d,#1f6b33 70%,#3f8f3a);color:#fff;padding:16px 18px 18px;position:relative}
.top .lg{height:30px;filter:brightness(0) invert(1);opacity:.95;display:block}
.top small{display:block;color:#b9dcbf;font-size:11px;letter-spacing:.6px;font-weight:700;margin-top:12px;text-transform:uppercase}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px;margin:2px 0 0}
.top .volta{position:absolute;right:14px;top:14px;background:rgba(255,255,255,.16);color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;font-size:12px;text-decoration:none}
.st{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.16);white-space:nowrap}
.st.off{background:#fff2dc;color:var(--warn)}
.abas{display:flex;gap:6px;padding:10px 12px 0;max-width:560px;margin:0 auto}
.aba{flex:1;text-align:center;padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.aba.on{background:var(--v7);border-color:var(--v3);color:var(--v1)}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 90px}
.c{background:#fff;border:none;border-left:4px solid #2E7D32;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.lbl{font-size:11px;font-weight:800;color:var(--v1);letter-spacing:.6px;text-transform:uppercase;margin:0 0 6px}
select,input,textarea{font:inherit;font-size:16px;width:100%;padding:10px 11px;border:1.5px solid #cbd6ca;border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:80px;resize:vertical;line-height:1.45}
.big{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bb{border:1.5px dashed #9fbf98;background:#f0f6ee;border-radius:12px;padding:16px 6px;text-align:center;font-size:14px;font-weight:800;color:var(--v1);cursor:pointer;user-select:none}
.bb svg{display:block;margin:0 auto 5px}
.bb.rec{background:#fdecea;border-color:#e57373;color:var(--danger)}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.th{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;background:#dde5dc}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:13px;line-height:22px;padding:0;cursor:pointer}
.au{display:flex;align-items:center;gap:8px;background:#f3f6f2;border-radius:10px;padding:6px 8px;margin-top:8px;font-size:13px}
.au audio{flex:1;height:34px;min-width:0}
.au button,.lk{border:0;background:none;color:var(--muted);font-size:12.5px;cursor:pointer;padding:4px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:15px;text-align:center;background:var(--v2);color:#fff;cursor:pointer}
.btn:disabled{opacity:.5}
.mini{font-size:12px;color:var(--muted)}
.msg{font-size:13px;font-weight:700;margin-top:8px;text-align:center}
.it{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #eef2ed;cursor:pointer}
.it:last-child{border:0}
.it .tx{flex:1;min-width:0;font-size:14px}
.it .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .mi{width:48px;height:48px;border-radius:9px;overflow:hidden;background:#dde5dc;flex:none}
.it .mi img{width:100%;height:100%;object-fit:cover}
.tag{border-radius:7px;padding:2px 8px;font-size:11.5px;font-weight:700;white-space:nowrap;align-self:flex-start}
.t1{background:#fff2dc;color:var(--warn)}.t2{background:var(--v7);color:var(--v1)}.t3{background:#e4eefb;color:#1d4f91}
.vazio{padding:16px 4px;color:var(--muted);font-size:14px;text-align:center}
.det img{width:100%;border-radius:10px;margin-bottom:8px;display:block}
</style>
</head>

function $(i){ return document.getElementById(i); }
function esc(t){ return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function pad(n){ return String(n).padStart(2,"0"); }
function dataHora(iso){ var d=new Date(iso), h=new Date(), ontem=new Date(Date.now()-864e5), mesmo=function(a,b){ return a.toDateString()===b.toDateString(); };
  return (mesmo(d,h)?"hoje":(mesmo(d,ontem)?"ontem":pad(d.getDate())+"/"+pad(d.getMonth()+1)))+" "+pad(d.getHours())+":"+pad(d.getMinutes()); }

/* ---------- banco no celular (IndexedDB) ---------- */
var DB=null;
function abrirDB(){ return new Promise(function(res,rej){ var r=indexedDB.open("gpl_campo",1);
  r.onupgradeneeded=function(){ r.result.createObjectStore("notas",{keyPath:"id"}); };
  r.onsuccess=function(){ DB=r.result; res(DB); }; r.onerror=function(){ rej(r.error); }; }); }
function tx(modo,fn){ return new Promise(function(res,rej){ var t=DB.transaction("notas",modo), s=t.objectStore("notas"), out=fn(s); t.oncomplete=function(){ res(out&&out.result!==undefined?out.result:out); }; t.onerror=function(){ rej(t.error); }; t.onabort=function(){ rej(t.error||new Error("o celular recusou guardar")); }; }); }
/* iPhone (Safari): às vezes recusa guardar o áudio como "arquivo" no banco do celular e o botão parecia não fazer nada.
   Agora foto e áudio são guardados como dados puros (ArrayBuffer) e voltam a ser arquivo na hora de ler. */
function lerBuf(b){ if(b.arrayBuffer) return b.arrayBuffer(); return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); }; r.readAsArrayBuffer(b); }); }
async function paraBuf(b){ return (b instanceof Blob) ? { __ab:await lerBuf(b), type:b.type||"" } : b; }
function deBuf(x){ return (x && x.__ab) ? new Blob([x.__ab],{type:x.type||""}) : x; }
async function serial(n){ var c=Object.assign({},n);
  c.fotos=await Promise.all((n.fotos||[]).map(paraBuf));
  c.audios=await Promise.all((n.audios||[]).map(async function(a){ return Object.assign({},a,{ blob:await paraBuf(a.blob) }); }));
  return c; }
function desserial(n){ n.fotos=(n.fotos||[]).map(deBuf); n.audios=(n.audios||[]).map(function(a){ a.blob=deBuf(a.blob); return a; }); return n; }
function todasNotas(){ return tx("readonly",function(s){ return s.getAll(); }).then(function(L){ return (L||[]).map(desserial).sort(function(a,b){ return b.criado.localeCompare(a.criado); }); }); }
async function salvarNota(n){ var c=await serial(n); return tx("readwrite",function(s){ s.put(c); }); }
function apagarNota(id){ return tx("readwrite",function(s){ s.delete(id); }); }

var URL_CENTRAL="https://script.google.com/macros/s/AKfycbzTIa9TZj69T5GtLuouKI3C5R8Hb3ceCUvjwHF7zuxp7pWJ10R9rBtGzhyn3FBsa7hh/exec";

function fazendas(){ var L=[], c=centralL();
  if(c.config&&c.config.fazendas) L=c.config.fazendas.map(function(f){ return f.nome; }).filter(Boolean);

/* foto: reduz pra no máximo 1280 px (JPEG) — guarda leve no celular e sobe rápido depois */
function reduzirFoto(file){ return new Promise(function(res){ var img=new Image(), u=URL.createObjectURL(file);
  img.onload=function(){ var M=1280, w=img.naturalWidth, h=img.naturalHeight, k=Math.min(1,M/Math.max(w,h)), cv=document.createElement("canvas");
    cv.width=Math.round(w*k); cv.height=Math.round(h*k); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(u);
    cv.toBlob(function(b){ res(b||file); },"image/jpeg",0.72); };
  img.onerror=function(){ URL.revokeObjectURL(u); res(file); }; img.src=u; }); }
function tirarFoto(){ var i=document.createElement("input"); i.type="file"; i.accept="image/*"; i.capture="environment"; i.multiple=true;
  i.onchange=async function(){ var fs=Array.prototype.slice.call(i.files||[]); for(var k=0;k<fs.length;k++) NOVA.fotos.push(await reduzirFoto(fs[k])); render(); }; i.click(); }

/* áudio: grava pelo microfone do celular (funciona sem internet) */
var REC=null;
/* iPhone/iPad: grava em MP4 (AAC). O WebM que o iPhone novo também grava sai com "Erro" no tocador do próprio iPhone. */
function ehIOS(){ var u=navigator.userAgent||""; return /iPhone|iPad|iPod/.test(u) || (/Macintosh/.test(u) && navigator.maxTouchPoints>1) || (/Safari/.test(u) && !/Chrome|CriOS|Android/.test(u)); }
async function gravar(){
  if(REC){ REC.mr.stop(); return; }
  if(!(navigator.mediaDevices&&window.MediaRecorder)){ alert("Este navegador não grava áudio. Use o Chrome do celular."); return; }
  try{
    var stream=await navigator.mediaDevices.getUserMedia({audio:true}), partes=[], tipo=(ehIOS()?["audio/mp4","audio/webm;codecs=opus","audio/webm"]:["audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus","audio/mp4"]).filter(function(t){ return MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t); })[0]||"";
    var mr=new MediaRecorder(stream,tipo?{mimeType:tipo}:undefined), ini=Date.now();
    REC={ mr:mr, ini:ini, t:setInterval(function(){ var e=$("recT"); if(e) e.textContent=seg(Math.round((Date.now()-ini)/1000)); },500) };
    mr.ondataavailable=function(e){ if(e.data&&e.data.size) partes.push(e.data); };
    mr.onstop=function(){ clearInterval(REC.t); stream.getTracks().forEach(function(t){ t.stop(); });
      var dur=Math.round((Date.now()-ini)/1000); REC=null;

function seg(s){ return Math.floor(s/60)+":"+pad(s%60); }

async function guardar(){

    +'<input id="snh" type="password" placeholder="Senha da Central" autocomplete="current-password">'
    +(NUVEM_ERRO?'<div class="mini" style="color:#b23b2e;margin-top:6px">'+esc(NUVEM_ERRO)+'</div>':'')
    +'<button class="btn" style="margin-top:8px" onclick="ligarCentral()">Ligar à planilha</button></div>';
  var p=pendNuvem().length;
  return '<div class="mini" style="text-align:center;margin:0 0 8px">'+(p?(navigator.onLine?(SINC?"☁ Salvando na planilha…":"☁ "+p+" pra subir pra planilha"+(NUVEM_ERRO?" · "+esc(NUVEM_ERRO):"")):"☁ "+p+" sobem pra planilha quando tiver sinal"):"☁ Tudo salvo na planilha ✓")+'</div>';
}
async function apagar(id){ if(!confirm("Apagar esta anotação do celular e da planilha? Não dá pra desfazer. (A foto e o áudio continuam guardados no seu Google Drive.)")) return;
  var L=filaApagar(); if(L.indexOf(id)<0) L.push(id); try{ localStorage.setItem("gpl_campo_apagar",JSON.stringify(L)); }catch(e){}
  await apagarNota(id); REMOTAS=REMOTAS.filter(function(x){ return x.id!==id; }); VER=null; await carregar(); render(); sincronizar(); }
/* apagadas no celular que ainda faltam sair da planilha (sai quando tiver sinal) */
function filaApagar(){ try{ return JSON.parse(localStorage.getItem("gpl_campo_apagar")||"[]")||[]; }catch(e){ return []; } }
function aba(a){ ABA=a; VER=null; MD=null; $("abA").className="aba"+(a==="anotar"?" on":""); $("abL").className="aba"+(a==="lista"?" on":""); render(); window.scrollTo(0,0);  if(a==="lista") carregarRemotas(); }
function statusTopo(){ var e=$("st"), pend=NOTAS.filter(function(n){ return n.status!=="mandada"; }).length, on=navigator.onLine;
  e.className="st"+(on?"":" off"); e.textContent=(on?"com sinal":"sem sinal")+(pend?" · "+pend+" pra mandar":"");
  var tot=listaTodas().length; $("nL").textContent=tot?"("+tot+")":""; }
function render(){ limparURLs(); $("app").innerHTML=ABA==="anotar"?telaAnotar():telaLista(); statusTopo(); }
/* anotações da planilha (feitas em outro aparelho): só pra ver e apagar aqui */
var REMOTAS=[];
function isoDe(t){ t=String(t||""); if(/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(t)){ var d=new Date(t.replace(" ","T")+":00"); if(!isNaN(d)) return d.toISOString(); } return t; }
function idDrive(u){ var m=/\/d\/([\w-]+)/.exec(String(u||"")); return m?m[1]:""; }
async function carregarRemotas(){ var c=centralL(); if(!c.senha||!navigator.onLine) return; var u=c.url||URL_CENTRAL;
  try{ var r=await fetch(u+(u.indexOf("?")>-1?"&":"?")+"acao=tabela_ler&tabela=Anotacoes&senha="+encodeURIComponent(c.senha)+"&t="+Date.now(),{credentials:"omit"});
    var j=JSON.parse(await r.text()); if(!j||!j.ok) return; var fila=filaApagar();
    REMOTAS=(j.itens||[]).filter(function(it){ return it.id && fila.indexOf(it.id)<0; }).map(function(it){ var sp=function(x){ return String(x||"").split(/\s+/).filter(Boolean); };
      return { id:it.id, remoto:true, fazenda:it.fazenda, criado:isoDe(it.criado), texto:it.texto||"", fotosUrl:sp(it.fotos), audiosUrl:sp(it.audios), fotos:[], audios:[],
        status:/mandada/i.test(it.situacao)?"mandada":"celular", mandada:it.para?{para:it.para}:null }; });
  }catch(e){ return; }
  if(ABA==="lista" && !MD) render(); else statusTopo(); }
function listaTodas(){ var ids={}; NOTAS.forEach(function(n){ ids[n.id]=1; });
  return NOTAS.concat(REMOTAS.filter(function(r){ return !ids[r.id]; })).sort(function(a,b){ return String(b.criado).localeCompare(String(a.criado)); }); }
function itemRemoto(n){ var nf=n.fotosUrl.length, na=n.audiosUrl.length, tit=n.texto||((nf?nf+" foto"+(nf>1?"s":""):"")+(na?(nf?" · ":"")+"áudio":"")), fid=idDrive(n.fotosUrl[0]);
  return '<div class="it" onclick="VER=\''+n.id+'\';render()">'+(fid?'<div class="mi"><img src="https://drive.google.com/thumbnail?id='+fid+'&sz=w200" alt="" onerror="this.parentNode.style.display=\'none\'"></div>':'')
    +'<div class="tx"><b>'+esc(tit)+'</b><span class="mini">'+esc(n.fazenda)+' · '+dataHora(n.criado)+(nf?' · '+nf+' foto'+(nf>1?'s':''):'')+(na?' · '+na+' áudio'+(na>1?'s':''):'')+' · ☁ feita em outro aparelho</span></div>'+tagNota(n)+'</div>'; }
function telaVerRemota(n){
  var h='<div class="c det"><button class="lk" onclick="VER=null;render()">‹ voltar</button><div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0 10px"><b>'+esc(n.fazenda)+'</b>'+tagNota(n)+'</div>'
    +'<div class="mini" style="margin-bottom:8px">'+dataHora(n.criado)+' · feita em outro aparelho (vem da planilha)</div>'
    +(n.texto?'<div style="font-size:15px;line-height:1.5;white-space:pre-wrap;margin-bottom:10px">'+esc(n.texto)+'</div>':'')
    +n.fotosUrl.map(function(u,i){ var id=idDrive(u); return '<a href="'+esc(u)+'" target="_blank" rel="noopener" style="display:block;margin-bottom:8px">'+(id?'<img src="https://drive.google.com/thumbnail?id='+id+'&sz=w1000" alt="" onerror="this.outerHTML=\'📷 Ver foto '+(i+1)+' no Drive\'">':'📷 Ver foto '+(i+1)+' no Drive')+'</a>'; }).join("")
    +n.audiosUrl.map(function(u,i){ return '<a class="btn" href="'+esc(u)+'" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none;background:#fff;color:var(--v1);border:1.5px solid var(--line);margin-bottom:8px">▶ Ouvir áudio'+(n.audiosUrl.length>1?' '+(i+1):'')+'</a>'; }).join("")
    +'<div class="mini" style="margin-top:6px">Pra mandar no WhatsApp com a foto e o áudio, use o aparelho onde ela foi feita.</div>'
    +'<button class="lk" style="color:var(--danger);margin-top:12px" onclick="apagarRemota(\''+n.id+'\')">Apagar esta anotação da planilha</button></div>';
  return h; }
async function apagarRemota(id){ if(!confirm("Apagar esta anotação da planilha? Não dá pra desfazer. (A foto e o áudio continuam guardados no seu Google Drive.)")) return;
  var c=centralL(); try{ var r=await postCentral(c,"tabela_salvar",{ tabela:"Anotacoes", itens:[{id:id,apagar:true}] }); if(!r.ok) throw new Error(r.msg||"não apagou"); }
  catch(e){ alert("Não apagou: "+(e.message||e)+". Tente com sinal."); return; }
  REMOTAS=REMOTAS.filter(function(x){ return x.id!==id; }); VER=null; render(); }
async function carregar(){ NOTAS=await todasNotas(); }

window.addEventListener("online",function(){ carregarRemotas(); statusTopo(); sincronizar(); if(MD) render(); }); window.addEventListener("offline",function(){ statusTopo(); if(MD) render(); });
(async function(){
  try{ await abrirDB(); await carregar(); }catch(e){ $("app").innerHTML='<div class="c">Este navegador não deixou guardar dados no celular: '+esc(e.message||e)+'</div>'; return; }
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}   // pede pro Chrome não apagar as anotações
  render(); sincronizar(); carregarRemotas();
  if("serviceWorker" in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register("sw-campo.js",{scope:"./campo-gpl"}).catch(function(){});
})();
</script>
