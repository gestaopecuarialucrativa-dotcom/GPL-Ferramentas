<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1B5E20">
<title>Anotar no campo · GPL</title>
<style>
:root{--v1:#1B5E20;--v2:#2E7D32;--v3:#4CAF50;--v7:#E8F5E9;--bg:#eef2ec;--line:#dfe6de;--ink:#1c241c;--muted:#5f6b60;--warn:#8a5a00;--danger:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.top{position:sticky;top:0;z-index:5;background:var(--v1);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px}
.top b{font-size:16px;flex:1}
.st{font-size:11.5px;border-radius:999px;padding:4px 10px;background:rgba(255,255,255,.16);white-space:nowrap}
.st.off{background:#fff2dc;color:var(--warn);font-weight:700}
.abas{display:flex;gap:6px;padding:10px 12px 0;max-width:560px;margin:0 auto}
.aba{flex:1;text-align:center;padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.aba.on{background:var(--v7);border-color:var(--v3);color:var(--v1)}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 90px}
.c{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.lbl{font-size:11px;font-weight:800;color:var(--v1);letter-spacing:.6px;text-transform:uppercase;margin:0 0 6px}
select,input,textarea{font:inherit;font-size:16px;width:100%;padding:10px 11px;border:1.5px solid #cbd6ca;border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:80px;resize:vertical;line-height:1.45}
.big{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bb{border:1.5px dashed #9fbf98;background:#f0f6ee;border-radius:12px;padding:16px 6px;text-align:center;font-size:14px;font-weight:800;color:var(--v1);cursor:pointer;user-select:none}
.bb svg{display:block;margin:0 auto 5px}
.bb.rec{background:#fdecea;border-color:#e57373;color:var(--danger)}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.th{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;background:#dde5dc}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:13px;line-height:22px;padding:0;cursor:pointer}
.au{display:flex;align-items:center;gap:8px;background:#f3f6f2;border-radius:10px;padding:6px 8px;margin-top:8px;font-size:13px}
.au audio{flex:1;height:34px;min-width:0}
.au button,.lk{border:0;background:none;color:var(--muted);font-size:12.5px;cursor:pointer;padding:4px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:15px;text-align:center;background:var(--v2);color:#fff;cursor:pointer}
.btn:disabled{opacity:.5}
.mini{font-size:12px;color:var(--muted)}
.msg{font-size:13px;font-weight:700;margin-top:8px;text-align:center}
.it{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #eef2ed;cursor:pointer}
.it:last-child{border:0}
.it .tx{flex:1;min-width:0;font-size:14px}
.it .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .mi{width:48px;height:48px;border-radius:9px;overflow:hidden;background:#dde5dc;flex:none}
.it .mi img{width:100%;height:100%;object-fit:cover}
.tag{border-radius:7px;padding:2px 8px;font-size:11.5px;font-weight:700;white-space:nowrap;align-self:flex-start}
.t1{background:#fff2dc;color:var(--warn)}.t2{background:var(--v7);color:var(--v1)}.t3{background:#e4eefb;color:#1d4f91}
.vazio{padding:16px 4px;color:var(--muted);font-size:14px;text-align:center}
.det img{width:100%;border-radius:10px;margin-bottom:8px;display:block}
</style>
</head>
<body>
<div class="top"><b>Anotar no campo</b><span class="st" id="st"></span></div>
<div class="abas"><div class="aba on" id="abA" onclick="aba('anotar')">Anotar</div><div class="aba" id="abL" onclick="aba('lista')">Anotações <span id="nL"></span></div></div>
<div class="wrap" id="app"></div>

<script>
/* =====================================================================
   ANOTAR NO CAMPO — GPL (parte 1: anotar e guardar SEM INTERNET)
   Foto, áudio e texto ficam no próprio celular (IndexedDB).
   Parte 2 (depois de testar esta): subir pra Central quando pegar sinal.
   Parte 3: mandar no WhatsApp (fotos + texto) e virar tarefa no Plano.
   ===================================================================== */
function $(i){ return document.getElementById(i); }
function esc(t){ return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function pad(n){ return String(n).padStart(2,"0"); }
function dataHora(iso){ var d=new Date(iso), h=new Date(), ontem=new Date(Date.now()-864e5), mesmo=function(a,b){ return a.toDateString()===b.toDateString(); };
  return (mesmo(d,h)?"hoje":(mesmo(d,ontem)?"ontem":pad(d.getDate())+"/"+pad(d.getMonth()+1)))+" "+pad(d.getHours())+":"+pad(d.getMinutes()); }

/* ---------- banco no celular (IndexedDB) ---------- */
var DB=null;
function abrirDB(){ return new Promise(function(res,rej){ var r=indexedDB.open("gpl_campo",1);
  r.onupgradeneeded=function(){ r.result.createObjectStore("notas",{keyPath:"id"}); };
  r.onsuccess=function(){ DB=r.result; res(DB); }; r.onerror=function(){ rej(r.error); }; }); }
function tx(modo,fn){ return new Promise(function(res,rej){ var t=DB.transaction("notas",modo), s=t.objectStore("notas"), out=fn(s); t.oncomplete=function(){ res(out&&out.result!==undefined?out.result:out); }; t.onerror=function(){ rej(t.error); }; }); }
function todasNotas(){ return tx("readonly",function(s){ return s.getAll(); }).then(function(L){ return (L||[]).sort(function(a,b){ return b.criado.localeCompare(a.criado); }); }); }
function salvarNota(n){ return tx("readwrite",function(s){ s.put(n); }); }
function apagarNota(id){ return tx("readwrite",function(s){ s.delete(id); }); }

/* ---------- fazendas: as mesmas da Central (mesmo site, mesmo aparelho) ---------- */
function fazendas(){ var L=[];
  try{ var c=JSON.parse(localStorage.getItem("gpl_central_v1")||"null"); if(c&&c.config&&c.config.fazendas) L=c.config.fazendas.map(function(f){ return f.nome; }).filter(Boolean); }catch(e){}
  if(!L.length) L=["Fazenda Estrela"];
  return L; }

/* ---------- estado da anotação em andamento ---------- */
var NOVA={ fazenda:"", texto:"", fotos:[], audios:[] }, ABA="anotar", NOTAS=[], VER=null, URLS=[];
try{ NOVA.fazenda=localStorage.getItem("gpl_campo_faz")||""; }catch(e){}
function limparURLs(){ URLS.forEach(function(u){ try{ URL.revokeObjectURL(u); }catch(e){} }); URLS=[]; }
function urlDe(blob){ var u=URL.createObjectURL(blob); URLS.push(u); return u; }

/* foto: reduz pra no máximo 1280 px (JPEG) — guarda leve no celular e sobe rápido depois */
function reduzirFoto(file){ return new Promise(function(res){ var img=new Image(), u=URL.createObjectURL(file);
  img.onload=function(){ var M=1280, w=img.naturalWidth, h=img.naturalHeight, k=Math.min(1,M/Math.max(w,h)), cv=document.createElement("canvas");
    cv.width=Math.round(w*k); cv.height=Math.round(h*k); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(u);
    cv.toBlob(function(b){ res(b||file); },"image/jpeg",0.72); };
  img.onerror=function(){ URL.revokeObjectURL(u); res(file); }; img.src=u; }); }
function tirarFoto(){ var i=document.createElement("input"); i.type="file"; i.accept="image/*"; i.capture="environment"; i.multiple=true;
  i.onchange=async function(){ var fs=Array.prototype.slice.call(i.files||[]); for(var k=0;k<fs.length;k++) NOVA.fotos.push(await reduzirFoto(fs[k])); render(); }; i.click(); }

/* áudio: grava pelo microfone do celular (funciona sem internet) */
var REC=null;
async function gravar(){
  if(REC){ REC.mr.stop(); return; }
  if(!(navigator.mediaDevices&&window.MediaRecorder)){ alert("Este navegador não grava áudio. Use o Chrome do celular."); return; }
  try{
    var stream=await navigator.mediaDevices.getUserMedia({audio:true}), partes=[], tipo=["audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus","audio/mp4"].filter(function(t){ return MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t); })[0]||"";
    var mr=new MediaRecorder(stream,tipo?{mimeType:tipo}:undefined), ini=Date.now();
    REC={ mr:mr, ini:ini, t:setInterval(function(){ var e=$("recT"); if(e) e.textContent=seg(Math.round((Date.now()-ini)/1000)); },500) };
    mr.ondataavailable=function(e){ if(e.data&&e.data.size) partes.push(e.data); };
    mr.onstop=function(){ clearInterval(REC.t); stream.getTracks().forEach(function(t){ t.stop(); });
      var dur=Math.round((Date.now()-ini)/1000); REC=null;
      if(partes.length) NOVA.audios.push({ blob:new Blob(partes,{type:mr.mimeType||tipo||"audio/webm"}), dur:dur });
      render(); };
    mr.start(); render();
  }catch(e){ REC=null; alert("Não consegui usar o microfone: "+(e.message||e)+". Libere o microfone para este site nas configurações do Chrome."); }
}
function seg(s){ return Math.floor(s/60)+":"+pad(s%60); }

async function guardar(){
  var t=($("tx")||{}).value; if(t!=null) NOVA.texto=t;
  var f=($("fz")||{}).value; if(f) NOVA.fazenda=f;
  if(!NOVA.texto.trim() && !NOVA.fotos.length && !NOVA.audios.length){ msg("Tire uma foto, grave um áudio ou escreva algo.",true); return; }
  if(REC){ msg("Pare a gravação antes de guardar.",true); return; }
  var n={ id:"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), fazenda:NOVA.fazenda||fazendas()[0], criado:new Date().toISOString(),
    texto:NOVA.texto.trim(), fotos:NOVA.fotos, audios:NOVA.audios, status:"celular" };
  try{ await salvarNota(n); }catch(e){ msg("Não guardou: "+(e.message||e),true); return; }
  try{ localStorage.setItem("gpl_campo_faz",n.fazenda); }catch(e){}
  NOVA={ fazenda:n.fazenda, texto:"", fotos:[], audios:[] };
  await carregar(); render(); msg("Guardada no celular ✓",false);
}
function msg(t,erro){ var e=$("msg"); if(!e) return; e.textContent=t; e.style.color=erro?"var(--danger)":"var(--v1)"; clearTimeout(msg.t); msg.t=setTimeout(function(){ if(e) e.textContent=""; },4000); }

/* ---------- telas ---------- */
var ICAM='<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l2-3h4l2 3"/></svg>';
var IMIC='<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>';
var ISTOP='<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
function telaAnotar(){
  var FZ=fazendas(); if(!NOVA.fazenda||FZ.indexOf(NOVA.fazenda)<0) NOVA.fazenda=FZ[0];
  var h='<div class="c"><div class="lbl">Fazenda</div><select id="fz" onchange="NOVA.fazenda=this.value">'+FZ.map(function(f){ return '<option'+(f===NOVA.fazenda?' selected':'')+'>'+esc(f)+'</option>'; }).join("")+'</select></div>';
  h+='<div class="c"><div class="big"><div class="bb" onclick="tirarFoto()">'+ICAM+'Foto</div>'
    +'<div class="bb'+(REC?' rec':'')+'" onclick="gravar()">'+(REC?ISTOP+'Parar · <span id="recT">0:00</span>':IMIC+'Gravar áudio')+'</div></div>';
  if(NOVA.fotos.length) h+='<div class="thumbs">'+NOVA.fotos.map(function(b,i){ return '<div class="th"><img src="'+urlDe(b)+'" alt=""><button onclick="NOVA.fotos.splice('+i+',1);render()" aria-label="tirar foto">×</button></div>'; }).join("")+'</div>';
  NOVA.audios.forEach(function(a,i){ h+='<div class="au"><audio controls src="'+urlDe(a.blob)+'"></audio><span class="mini">'+seg(a.dur)+'</span><button onclick="NOVA.audios.splice('+i+',1);render()">apagar</button></div>'; });
  h+='</div>';
  h+='<div class="c"><div class="lbl">Texto <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted)">· pode ditar no microfone do teclado</span></div><textarea id="tx" placeholder="ex.: bebedouro m2p4 vazando, boia quebrada" oninput="NOVA.texto=this.value">'+esc(NOVA.texto)+'</textarea></div>';
  h+='<button class="btn" onclick="guardar()">Guardar anotação</button><div class="mini" style="text-align:center;margin-top:6px">fica guardada neste celular · funciona sem sinal</div><div class="msg" id="msg"></div>';
  return h;
}
function tagNota(n){ return n.status==="mandada"?'<span class="tag t3">mandada</span>':(n.status==="central"?'<span class="tag t2">na Central</span>':'<span class="tag t1">no celular</span>'); }
function telaLista(){
  if(VER) return telaVer();
  if(!NOTAS.length) return '<div class="c"><div class="vazio">Nenhuma anotação ainda.</div></div>';
  return '<div class="c">'+NOTAS.map(function(n){ var tit=n.texto||((n.fotos.length?n.fotos.length+" foto"+(n.fotos.length>1?"s":""):"")+(n.audios.length?(n.fotos.length?" · ":"")+"áudio":""));
    return '<div class="it" onclick="VER=\''+n.id+'\';render()">'+(n.fotos[0]?'<div class="mi"><img src="'+urlDe(n.fotos[0])+'" alt=""></div>':'')
      +'<div class="tx"><b>'+esc(tit)+'</b><span class="mini">'+esc(n.fazenda)+' · '+dataHora(n.criado)+(n.fotos.length?' · '+n.fotos.length+' foto'+(n.fotos.length>1?'s':''):'')+(n.audios.length?' · '+n.audios.length+' áudio'+(n.audios.length>1?'s':''):'')+'</span></div>'+tagNota(n)+'</div>'; }).join("")+'</div>'
    +'<div class="mini" style="text-align:center">Toque numa anotação pra ver. Subir pra Central e mandar no WhatsApp vêm na próxima parte.</div>';
}
function telaVer(){
  var n=NOTAS.filter(function(x){ return x.id===VER; })[0]; if(!n){ VER=null; return telaLista(); }
  var h='<div class="c det"><button class="lk" onclick="VER=null;render()">‹ voltar</button><div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0 10px"><b>'+esc(n.fazenda)+'</b>'+tagNota(n)+'</div>'
    +'<div class="mini" style="margin-bottom:8px">'+dataHora(n.criado)+'</div>'
    +(n.texto?'<div style="font-size:15px;line-height:1.5;white-space:pre-wrap;margin-bottom:10px">'+esc(n.texto)+'</div>':'')
    +n.fotos.map(function(b){ return '<img src="'+urlDe(b)+'" alt="">'; }).join("")
    +n.audios.map(function(a){ return '<div class="au"><audio controls src="'+urlDe(a.blob)+'"></audio><span class="mini">'+seg(a.dur)+'</span></div>'; }).join("")
    +'<button class="lk" style="color:var(--danger);margin-top:12px" onclick="apagar(\''+n.id+'\')">Apagar esta anotação</button></div>';
  return h;
}
async function apagar(id){ if(!confirm("Apagar esta anotação do celular? Não dá pra desfazer.")) return; await apagarNota(id); VER=null; await carregar(); render(); }
function aba(a){ ABA=a; VER=null; $("abA").className="aba"+(a==="anotar"?" on":""); $("abL").className="aba"+(a==="lista"?" on":""); render(); window.scrollTo(0,0); }
function statusTopo(){ var e=$("st"), pend=NOTAS.filter(function(n){ return n.status==="celular"; }).length, on=navigator.onLine;
  e.className="st"+(on?"":" off"); e.textContent=(on?"com sinal":"sem sinal")+(pend?" · "+pend+" guardada"+(pend>1?"s":""):"");
  $("nL").textContent=NOTAS.length?"("+NOTAS.length+")":""; }
function render(){ limparURLs(); $("app").innerHTML=ABA==="anotar"?telaAnotar():telaLista(); statusTopo(); }
async function carregar(){ NOTAS=await todasNotas(); }

window.addEventListener("online",statusTopo); window.addEventListener("offline",statusTopo);
(async function(){
  try{ await abrirDB(); await carregar(); }catch(e){ $("app").innerHTML='<div class="c">Este navegador não deixou guardar dados no celular: '+esc(e.message||e)+'</div>'; return; }
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}   // pede pro Chrome não apagar as anotações
  render();
  if("serviceWorker" in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register("sw-campo.js",{scope:"./campo-gpl"}).catch(function(){});
})();
</script>
</body>
</html>
