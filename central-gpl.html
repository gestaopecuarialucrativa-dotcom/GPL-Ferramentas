<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central GPL</title>
<link rel="apple-touch-icon" href="icone-caixa-gpl.png">
<link rel="icon" type="image/png" href="icone-caixa-gpl.png">
<meta name="apple-mobile-web-app-title" content="Central GPL">
<meta name="theme-color" content="#1B5E20">
<meta name="robots" content="noindex">
<style>
:root{--v1:#1B5E20;--v2:#2E7D32;--v3:#4CAF50;--v7:#E8F5E9;--bg:#eef2ec;--card:#fff;--line:#dfe6de;--ink:#1c241c;--muted:#5f6b60;--warn:#c9820a;--danger:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.top{background:var(--v1);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.top img{width:32px;height:32px;border-radius:8px}.top .t1{font-weight:700;font-size:16px}.top .t2{font-size:12px;opacity:.85}
.top .sp{flex:1}.top button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:12px 14px 40px}
.abas{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.aba{flex:1;min-width:0;text-align:center;padding:10px 2px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.aba.on{background:var(--v7);border-color:var(--v3);color:var(--v1)}
.sec{font-size:13px;color:var(--muted);margin:14px 2px 6px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin-bottom:10px}
.item{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #eef2ed}
.item:last-child{border-bottom:0}
.ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#f1f4ef;color:var(--muted)}
.ico.warn{background:#fff4e0;color:var(--warn)}.ico.err{background:#fdecea;color:var(--danger)}.ico.ok{background:var(--v7);color:var(--v1)}
.ico svg{width:19px;height:19px}
.it1{font-size:15px;font-weight:700}.it2{font-size:13px;color:var(--muted);margin-top:2px}
.acts{display:flex;gap:6px;flex-shrink:0}
button{font:inherit;cursor:pointer}
.b{border:1px solid #c9d6c7;background:#fff;color:var(--v1);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:700}
.b.p{background:var(--v2);border-color:var(--v2);color:#fff}
.b.g{border-color:transparent;background:#f1f4ef;color:var(--muted)}
input,select{font:inherit;font-size:16px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.lbl{font-size:13px;color:var(--muted);margin:10px 0 5px}
.linha{display:flex;gap:8px}.linha>*{flex:1}
.vazio{padding:14px 0;color:var(--muted);font-size:14px}
.mini{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sis{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-decoration:none;color:var(--ink);display:block}
.sis b{display:block;font-size:15px}.sis span{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 12px}
.kpi{background:#f4f7f3;border-radius:10px;padding:9px 10px}.kpi .k1{font-size:12px;color:var(--muted)}.kpi .k2{font-size:18px;font-weight:900;margin-top:2px}
.feito{text-decoration:line-through;color:#9aa59a}
.erro{background:#fdecea;color:var(--danger);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;margin-bottom:10px}
.dia{font-size:13px;font-weight:800;color:var(--v1);margin:12px 2px 4px}
</style>
</head>
<body>
<div class="top"><img src="icone-caixa-gpl.png" alt=""><div><div class="t1">Central GPL</div><div class="t2" id="topSub"></div></div><div class="sp"></div>
  <button id="btAtualizar" onclick="carregarTudo(true)" style="display:none">Atualizar</button></div>
<div class="wrap" id="app"></div>

<script>
/* =====================================================================
   CENTRAL GPL — v1 (etapa 1)
   Hoje: o que precisa de você (2ª dose, lote sem pesar, insumo acabando,
   manejo ao vivo) · Agenda e lembretes · Fazendas · Sistemas · Ajustes
   - Agenda e ajustes: planilha própria da Central (com senha).
   - Fazendas: só LÊ os backends da pesagem e do app da fazenda.
   ===================================================================== */
var LS="gpl_central_v1";
var PADRAO={
  dose2Dias:30, semPesarDias:60, insumoDias:15,
  rotinaEtapas:["Coleta de campo do mês (pesagem, manejo, trato)","Lançamentos conferidos na Inttegra","Relatório do mês gerado","Reunião de fechamento com o dono","Plano de ação revisado"],
  /* rotina nova (aula Rotina mensal do consultor certificado): "Nome | dia do prazo" — dia é opcional */
  rotinaMes:["Cliente lançou o mês na Inttegra | 15","Coleta de campo (pesagem, manejo, trato)","Validação na Inttegra | 15","Fechamento: financeiro + econômico","Reunião mensal com o dono","Plano de ação revisado"],
  rotinaTri:["Visita trimestral","Consolidado trimestral entregue"],
  fazendas:[{ nome:"Fazenda Estrela",
    pesagem:"https://script.google.com/macros/s/AKfycby4lOB4zXu2dCBoA-pda6U_do8v9GDvNuH0dFOY6u5kc7FP7gZdPKofZX5Dt-QgnT4V/exec",
    app:"https://script.google.com/macros/s/AKfycbxhLo4cpRZsBMSEzcfM8sBFCH25dCe1X_VFvElz3dfhMLdZhQF9CTrXfq2DE4QJ4d0rbg/exec" }]
};
var SISTEMAS=[
  ["Pesagem de curral","pesagem-curral.html","Pesar, relatório, venda"],
  ["Manejo do vaqueiro","manejo-curral.html?montar=1","Link, ao vivo, relatório"],
  ["App da fazenda","https://gestaopecuarialucrativa-dotcom.github.io/fazenda-gpl/","Trato, estoque, mapa"],
  ["Análise de rebanho","analise-rebanho-gpl.html","GMD, evolução, abate"],
  ["Raio-X","raiox.html","Safra e indicadores"],
  ["Funil da consultoria","funil-gpl.html","Leads e contatos"],
  ["Caixa semanal","caixa-semanal-gpl-v2.html","Acerto com o dono"],
  ["Máquinas","https://gestaopecuarialucrativa-dotcom.github.io/App_Maquinas/","Frota e serviços"],
  ["Representação","https://gestaopecuarialucrativa-dotcom.github.io/App_Representacao/","Intergrãos"],
  ["Gestor de clientes","gestor-clientes.html","Acessos e links"],
  ["Pesagem ao vivo (cliente)","painel-cliente.html","O que o dono vê"],
  ["Portal do cliente","cliente.html","Ferramentas do cliente"]
];

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function fmt(n,d){ return Number(n).toLocaleString("pt-BR",{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }
function isoDe(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function hoje(){ return isoDe(new Date()); }
function somaDias(iso,n){ var d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return isoDe(d); }
function difDias(a,b){ return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5); }
var SEM=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
function quando(iso){ var n=difDias(hoje(),iso); var p=iso.split("-");
  if(n===0) return "hoje"; if(n===1) return "amanhã"; if(n===-1) return "ontem";
  if(n<0) return "venceu há "+(-n)+" dias ("+p[2]+"/"+p[1]+")";
  if(n<7) return SEM[new Date(iso+"T12:00:00").getDay()]+" ("+p[2]+"/"+p[1]+")"; return p[2]+"/"+p[1]; }
var ICO={
  vacina:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4"/><path d="M19 5l-9 9"/><path d="M14 6l4 4"/><path d="M10 14l-3 3-2-2 3-3"/><path d="M5 19l-2 2"/><path d="M12 8l4 4"/></svg>',
  pacote:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5"/><path d="M12 12v9"/><path d="M12 12L4 7.5"/></svg>',
  balanca:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M5 7h14"/><path d="M5 7l-3 7h6z"/><path d="M19 7l-3 7h6z"/><path d="M8 21h8"/></svg>',
  vivo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M5.6 5.6a9 9 0 0 0 0 12.8"/><path d="M18.4 5.6a9 9 0 0 1 0 12.8"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  circulo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="8"/></svg>',
  agenda:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4"/><path d="M8 3v4"/><path d="M3 11h18"/></svg>'
};

/* ---------- guardado no aparelho ---------- */
var URL_CENTRAL="https://script.google.com/macros/s/AKfycbzTIa9TZj69T5GtLuouKI3C5R8Hb3ceCUvjwHF7zuxp7pWJ10R9rBtGzhyn3FBsa7hh/exec";
var L={ url:URL_CENTRAL, senha:"", config:null, cache:null };
try{ var r0=localStorage.getItem(LS); if(r0) L=Object.assign(L,JSON.parse(r0)); }catch(e){}
if(!L.url) L.url=URL_CENTRAL;
function salvarL(){ try{ localStorage.setItem(LS,JSON.stringify(L)); }catch(e){} }
function cfg(){ return Object.assign({},PADRAO,L.config||{}); }

function jsonp(url,ms){
  return new Promise(function(res,rej){
    var cb="__cg_"+Date.now()+"_"+Math.floor(Math.random()*1e5), s=document.createElement("script");
    var t=setTimeout(function(){ fim(); rej(new Error("demorou demais")); }, ms||30000);
    function fim(){ try{ delete window[cb]; }catch(e){ window[cb]=undefined; } if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb]=function(d){ clearTimeout(t); fim(); res(d); };
    s.onerror=function(){ clearTimeout(t); fim(); rej(new Error("sem conexão")); };
    s.src=url+(url.indexOf("?")<0?"?":"&")+"callback="+cb+"&t="+Date.now();
    document.head.appendChild(s);
  });
}
/* Central: busca SEM os cookies do Google (fetch). Com várias contas logadas no Chrome,
   o jeito antigo (script) mandava os cookies e o Google desviava pra outra conta e dava erro. */
async function central(acao,extra){
  var ctl=new AbortController(), t=setTimeout(function(){ ctl.abort(); },20000);
  try{
    var r=await fetch(L.url+"?acao="+acao+"&senha="+encodeURIComponent(L.senha)+(extra||"")+"&t="+Date.now(),{credentials:"omit",signal:ctl.signal});
    return JSON.parse(await r.text());
  }catch(e){ throw new Error(e.name==="AbortError"?"demorou demais":"sem conexão"); }
  finally{ clearTimeout(t); }
}
async function centralPost(action,data){
  data.senha=L.senha;
  var r=await fetch(L.url,{method:"POST",body:JSON.stringify({action:action,data:data}),credentials:"omit"});
  var j=null; try{ j=JSON.parse(await r.text()); }catch(e){}
  if(!j||!j.ok) throw new Error((j&&j.msg)||"não salvou");
  return j;
}

/* =====================================================================
   DADOS: agenda (Central) + cada fazenda (pesagem e app)
   ===================================================================== */
var D={ agenda:[], rotina:[], plano:[], faz:{}, erros:[], quando:"" };
async function carregarTudo(forcar){
  var c=cfg(); D.erros=[];
  $("topSub").textContent="atualizando…";
  var tarefas=[ central("agenda_ler").then(function(r){ if(!r||!r.ok) throw new Error(r&&r.msg||"agenda"); D.agenda=r.itens||[]; })
    .catch(function(e){ D.erros.push("Agenda: "+e.message); }) ];
  tarefas.push(central("tabela_ler","&tabela=Rotina").then(function(r){ if(!r||!r.ok) throw new Error(r&&r.msg||"rotina"); D.rotina=r.itens||[]; }).catch(function(e){ D.erros.push("Rotina: "+e.message); }));
  tarefas.push(central("tabela_ler","&tabela=Plano").then(function(r){ if(!r||!r.ok) throw new Error(r&&r.msg||"plano"); D.plano=r.itens||[]; }).catch(function(e){ D.erros.push("Plano de ação: "+e.message); }));
  await Promise.all(tarefas);
  D.quando=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  L.cache={agenda:D.agenda,rotina:D.rotina,plano:D.plano,quando:D.quando,dia:hoje()}; salvarL();
  $("topSub").textContent="atualizado "+D.quando;
  render();
  if(!D.erros.some(function(e){ return /^Agenda/.test(e); })) garantirLembretesCP();
}
async function carregarFazenda(f){
  var F=D.faz[f.nome]={ nome:f.nome, manejos:[], animais:[], vendidos:[], datas:[], estoque:[], ok:{} };
  var q="&token=&fazenda="+encodeURIComponent(f.nome);
  var amanha=somaDias(hoje(),1);
  var ps=[];
  if(f.pesagem){
    ps.push(jsonp(f.pesagem+"?acao=manejo_ler"+q).then(function(r){ F.manejos=agruparManejos((r&&r.itens)||[]); F.ok.manejo=true; }).catch(function(e){ D.erros.push(f.nome+" · manejo: "+e.message); }));
    ps.push(jsonp(f.pesagem+"?acao=pesagem_ultimas&antes="+amanha+q).then(function(r){ F.animais=(r&&r.animais)||[]; F.ok.pesagem=true; }).catch(function(e){ D.erros.push(f.nome+" · pesagem: "+e.message); }));
    ps.push(jsonp(f.pesagem+"?acao=venda_animais"+q).then(function(r){ F.vendidos=(r&&r.vendidos)||[]; }).catch(function(){}));
    ps.push(jsonp(f.pesagem+"?acao=pesagem_datas"+q).then(function(r){ F.datas=(r&&r.datas)||[]; }).catch(function(){}));
  }
  if(f.app){
    ps.push(jsonp(f.app+"?acao=carregar",45000).then(function(r){ F.estoque=estoqueDoApp(r); F.ok.app=true; }).catch(function(e){ D.erros.push(f.nome+" · app da fazenda: "+e.message); }));
  }
  await Promise.all(ps);
}
function agruparManejos(itens){
  var g={};
  itens.forEach(function(i){ var k=i.id; if(!g[k]) g[k]={id:k,data:i.data,tarefas:i.tarefas,n:0,horas:[]};
    if(String(i.situacao).toUpperCase()!=="DESFEITO"){ g[k].n++; g[k].horas.push(String(i.hora||"")); } });
  return Object.keys(g).map(function(k){ var x=g[k]; x.horas.sort(); x.ult=x.horas[x.horas.length-1]||""; return x; })
    .sort(function(a,b){ return b.data.localeCompare(a.data); });
}
/* mesma conta do "Relatório do Dia" do app: saldo = estoque − tratado; dias = saldo ÷ média de sacos/dia dos últimos 7 dias */
function estoqueDoApp(data){
  if(!data) return [];
  var c=null;
  if(data.CONFIG&&data.CONFIG.length&&data.CONFIG[0]&&data.CONFIG[0][1]){ try{ c=JSON.parse(data.CONFIG[0][1]); }catch(e){} }
  else if(data.rT!==undefined||data.EST!==undefined) c=data;
  if(!c) return [];
  var EST=c.EST||{}, rT=(c.rT||[]).filter(function(r){ return r&&!r._apagado&&r.tipo==="trato"; });
  var lim7=isoDe(new Date(Date.now()-7*864e5)), trat={}, s7={};
  rT.forEach(function(r){ var p=r.pr||r.prod||""; var q=parseFloat(r.q||r.qtd)||0; trat[p]=(trat[p]||0)+q; if((r.dt||"")>=lim7) s7[p]=(s7[p]||0)+q; });
  return Object.keys(EST).map(function(p){ var e=EST[p]||{}; var sd=(parseFloat(e.q)||0)-(trat[p]||0); var spd=(s7[p]||0)/7;
    return { produto:p, saldo:Math.round(sd*10)/10, dias:spd>0?Math.floor(sd/spd):null }; });
}
function baseBrinco(b){ return String(b||"").trim().toUpperCase().replace(/^SN-/,"").replace(/[^0-9]+$/,""); }
var LOTE_NOME={"11":"Vaca","12":"Reprodutor","13":"Bezerro mamando","14":"Enfermaria","15":"Compra","16":"Novilha"};
function nomeLote(n){ return LOTE_NOME[String(n)]||("Lote "+n); }

/* =====================================================================
   O QUE PRECISA DE VOCÊ
   ===================================================================== */
function feitoAuto(id){ return D.agenda.some(function(a){ return a.id===id && a.feito; }); }
function alertas(){
  var c=cfg(), out=[], h=hoje();
  Object.keys(D.faz).forEach(function(nf){ var F=D.faz[nf];
    // manejo acontecendo agora
    F.manejos.filter(function(m){ return m.data===h; }).forEach(function(m){
      out.push({ ordem:0, ico:"vivo", cls:"ok", t1:"Manejo hoje: "+m.n+" animal(is) passaram", t2:nf+" · "+m.tarefas+(m.ult?" · último às "+m.ult:""),
        acoes:[["Ao vivo","abrir('manejo-curral.html?montar=1')"]] });
    });
    // 2ª dose: manejo com 1ª dose e sem 2ª dose depois
    F.manejos.filter(function(m){ return /1ª dose|1a dose/i.test(m.tarefas||""); }).forEach(function(m){
      var id="auto-dose2-"+m.id; if(feitoAuto(id)) return;
      var teve2=F.manejos.some(function(x){ return x.data>m.data && /2ª dose|2a dose/i.test(x.tarefas||""); }); if(teve2) return;
      var vence=somaDias(m.data,c.dose2Dias), falta=difDias(h,vence);
      if(falta>7) return;
      out.push({ ordem:falta<0?1:2, ico:"vacina", cls:falta<0?"err":"warn", t1:"2ª dose da vacina de entrada", t2:nf+" · "+m.n+" animais (1ª dose "+m.data.split("-").reverse().slice(0,2).join("/")+") · "+quando(vence),
        acoes:[["Mandar link","linkDose2('"+esc(nf)+"',"+m.n+")"],["Feito","marcarAuto('"+id+"','2ª dose · "+esc(nf)+"','"+vence+"')"]] });
    });
    // lote sem pesar (sem contar vendidos)
    if(F.ok.pesagem){
      var vend={}; F.vendidos.forEach(function(v){ var b=baseBrinco(v.brinco); if(!vend[b]||v.data>vend[b]) vend[b]=v.data; });
      var porLote={};
      F.animais.forEach(function(a){ if(a.lote==null) return; var vb=vend[baseBrinco(a.brinco)]; if(vb && vb>=a.data) return;
        var k=String(a.lote); if(!porLote[k]) porLote[k]={n:0,ult:""}; porLote[k].n++; if(a.data>porLote[k].ult) porLote[k].ult=a.data; });
      Object.keys(porLote).sort(function(a,b){return a-b;}).forEach(function(k){ var x=porLote[k], dias=difDias(x.ult,h);
        var id="auto-pesar-"+nf+"-"+k+"-"+x.ult; if(dias<c.semPesarDias || feitoAuto(id)) return;
        out.push({ ordem:3, ico:"balanca", cls:"", t1:nomeLote(k)+" sem pesar há "+dias+" dias", t2:nf+" · "+x.n+" animais · última pesagem "+x.ult.split("-").reverse().join("/"),
          acoes:[["Agendar","agendarPesagem('"+esc(nf)+"','"+esc(nomeLote(k))+"','"+id+"')"]] });
      });
    }
    // insumo acabando
    F.estoque.forEach(function(e){ if(e.dias==null||e.dias>c.insumoDias) return;
      out.push({ ordem:e.dias<=7?1:2, ico:"pacote", cls:e.dias<=7?"err":"warn", t1:e.produto+" acaba em "+e.dias+" dia(s)", t2:nf+" · saldo "+fmt(e.saldo,1)+" · programar compra",
        acoes:[["Abrir app","abrir('https://gestaopecuarialucrativa-dotcom.github.io/fazenda-gpl/')"]] });
    });
  });
  return out.sort(function(a,b){ return a.ordem-b.ordem; });
}

/* =====================================================================
   TELAS
   ===================================================================== */
var ABA="rotina";
function render(){
  var app=$("app");
  if(!L.url||!L.senha){ app.innerHTML=telaEntrar(); $("btAtualizar").style.display="none"; return; }
  $("btAtualizar").style.display="";
  var h='<div class="abas">'+[["rotina","Rotina"],["plano","Plano"],["agenda","Agenda"],["sistemas","Sistemas"],["ajustes","Ajustes"]].map(function(a){
    return '<div class="aba'+(ABA===a[0]?' on':'')+'" onclick="ABA=\''+a[0]+'\';render()">'+a[1]+'</div>'; }).join("")+'</div>';
  if(D.erros.length) h+='<div class="erro">'+D.erros.map(esc).join("<br>")+'</div>';
  if(ABA==="campo"){ app.innerHTML=telaCampo(); return; }
  if(ABA==="rotina") h+=telaRotina(); else if(ABA==="plano") h+=telaPlano(); else if(ABA==="agenda") h+=telaAgenda();

/* =====================================================================
   ROTINA DO MÊS — checklist por fazenda (renova todo mês)
   ===================================================================== */
var MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
var MES=hoje().slice(0,7);
function mesNome(m){ var p=m.split("-"), n=MESES[+p[1]-1]; return n.charAt(0).toUpperCase()+n.slice(1)+" de "+p[0]; }
function mesMais(m,n){ var p=m.split("-"), d=new Date(+p[0],+p[1]-1+n,1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function idRot(f,m,et){ return f+"|"+m+"|"+et; }
var DICA_ET=[[/cliente lan/i,"dados para o score da Inttegra"],[/valida/i,"validar ou reprovar · conta na nota do certificado"],[/fechamento/i,"fluxo de caixa, receita e despesa · o que fugiu do padrão"],[/reuni/i,"pauta: dados → validação → financeiro → econômico → pendências → prioridades"],[/plano/i,"decisões da reunião viram ações"],[/visita/i,"preparar → campo → relatório da visita"],[/consolidado/i,"indicadores globais + fluxo de caixa previsto"],[/coleta/i,"pesagem, manejo e trato do mês"]];
function lerEtapa(l,sec){ var p=String(l).split("|"), nome=p[0].trim(), dia=parseInt(p[1],10); var d=DICA_ET.filter(function(x){ return x[0].test(nome); })[0]; return { nome:nome, dia:(dia>=1&&dia<=31)?dia:null, sec:sec, dica:d?d[1]:"" }; }
/* etapas da fazenda no mês: as de todo mês + as trimestrais nos meses marcados para aquela fazenda */
function etapasDe(f,mes){ var c=cfg(), out=(c.rotinaMes||[]).map(function(l){ return lerEtapa(l,"mes"); });
  var mm=+mes.split("-")[1]; if((f.mesesTri||[]).indexOf(mm)>=0) out=out.concat((c.rotinaTri||[]).map(function(l){ return lerEtapa(l,"tri"); }));
  return out.filter(function(e){ return e.nome; }); }
function etapaAtrasada(e,mes,ok){ if(ok) return false; var h=hoje(), hm=h.slice(0,7); if(mes<hm) return true; if(mes>hm) return false; return !!e.dia && +h.slice(8)>e.dia; }
var MES_AB=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function rotItem(f,m,et){ return D.rotina.filter(function(r){ return r.id===idRot(f,m,et); })[0]; }
function telaRotina(){
  var c=cfg();
  var x='<div style="display:flex;align-items:center;justify-content:space-between;margin:2px 2px 10px"><button class="b g" onclick="MES=mesMais(MES,-1);render()">‹</button>'
    +'<b style="font-size:17px">'+mesNome(MES)+'</b><button class="b g" onclick="MES=mesMais(MES,1);render()">›</button></div>';
  c.fazendas.forEach(function(f,fi){
    var EE=etapasDe(f,MES), ets=EE.map(function(e){ return e.nome; });
    var feitos=ets.filter(function(et){ var r=rotItem(f.nome,MES,et); return r&&r.feito; }).length, pct=ets.length?Math.round(feitos/ets.length*100):0;
    var abertosPl=D.plano.filter(function(p){ return p.fazenda===f.nome && p.situacao!=="feito"; }), atrasPl=abertosPl.filter(function(p){ return p.prazo && p.prazo<hoje(); });
    x+='<div class="card" style="padding:12px 14px"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:16px">'+esc(f.nome)+'</b><span class="mini">'+feitos+' de '+ets.length+'</span></div>'
      +'<div style="height:7px;background:#eef2ed;border-radius:4px;margin:8px 0 6px"><div style="width:'+pct+'%;height:7px;background:var(--v3);border-radius:4px"></div></div>'
      +cpLinha(f,fi);
    var secAtual="";
    EE.forEach(function(E,ei){
      var et=E.nome, r=rotItem(f.nome,MES,et), ok=r&&r.feito, atr=etapaAtrasada(E,MES,ok);
      if(E.sec!==secAtual){ secAtual=E.sec; x+='<div style="font-size:11px;font-weight:800;color:var(--v1);letter-spacing:1px;margin:10px 0 0;text-transform:uppercase">'+(E.sec==="tri"?'Trimestre':'Todo mês')+'</div>'; }
      var icoTxt=ok?ICO.check:(E.dia?'<b style="font-size:13px">'+E.dia+'</b>':ICO.circulo);
      var sub=ok&&r.data?'feito '+r.data.split("-").reverse().slice(0,2).join("/"):((E.dia?'até dia '+String(E.dia).padStart(2,"0"):'')+(E.dia&&E.dica?' · ':'')+E.dica+(atr?' · <b style="color:var(--danger)">atrasado</b>':''));
      x+='<div class="item"><div class="ico '+(ok?'ok':(atr?'err':''))+'" style="cursor:pointer" onclick="toggleRotina('+fi+','+ei+')">'+icoTxt+'</div>'
        +'<div style="flex:1;min-width:0">'+(acaoEtapa(et)?'<div class="it1'+(ok?' feito':'')+'" style="font-size:14px;cursor:pointer;color:var(--v1);text-decoration:underline;text-underline-offset:3px" onclick="abrirEtapa('+fi+','+ei+')">'+esc(et)+'</div>':'<div class="it1'+(ok?' feito':'')+'" style="font-size:14px">'+esc(et)+'</div>')
        +(sub?'<div class="it2">'+sub+'</div>':'')+'</div>'
        +'<div class="acts">'+(ok?'<button class="b g" onclick="toggleRotina('+fi+','+ei+')">Desfazer</button>':'<button class="b" onclick="toggleRotina('+fi+','+ei+')">Feito</button><button class="b g" onclick="agendarEtapa('+fi+','+ei+')">Agendar</button>')+'</div></div>';
    });
    if(!(f.mesesTri||[]).length) x+='<div class="mini" style="padding:8px 0 0">Trimestre: escolha os meses desta fazenda em Ajustes.</div>';
    x+='<div class="mini" style="padding:8px 0 4px">Plano de ação: '+abertosPl.length+' em aberto'+(atrasPl.length?' · <b style="color:var(--danger)">'+atrasPl.length+' atrasada(s)</b>':'')+'</div></div>';
  });
  return x+'<p class="mini" style="text-align:center">As etapas você muda em Ajustes, do jeito do seu método.</p>';
}
async function toggleRotina(fi,ei){
  var c=cfg(), faz=c.fazendas[fi].nome, et=etapasDe(c.fazendas[fi],MES)[ei].nome;

   +'td{padding:8px;border-bottom:1px solid #dfe6de;vertical-align:top}.rod{margin-top:22px;font-size:12px;color:#5f6b60}@media print{.np{display:none}}</style></head><body>'
   +'<div class="cab"><img src="'+location.origin+'/icone-caixa-gpl.png"><div><h1>Plano de ação</h1><div class="sub">'+esc(faz)+' · '+h.split("-").reverse().join("/")+'</div></div></div>'

/* =====================================================================
   RELATÓRIO DE CAMPO DO MÊS (abre ao tocar na etapa)
   Pastagem, insumo, estoque, feno, pesagem (GMD por lote), manejos, diárias.
   Mesmas contas do "Relatório do Dia" do app da fazenda, no mês escolhido.
   ===================================================================== */
var CAMPO={ fi:0, modo:"campo", dados:null, carregando:false, erro:"" };
function acaoEtapa(et){ et=String(et||"").toLowerCase();
  if(/campo|coleta/.test(et)) return "campo"; if(/inttegra/.test(et)) return "inttegra"; if(/fechamento/.test(et)) return "campo"; if(/reuni|pauta/.test(et)) return "pauta";
  if(/plano/.test(et)) return "plano"; if(/relat/.test(et)) return "campo"; return ""; }
function abrirEtapa(fi,ei){
  var c=cfg(), a=acaoEtapa(etapasDe(c.fazendas[fi],MES)[ei].nome);
  if(a==="inttegra"){ window.open("https://portal.inttegra.com/dashboard","_blank","noopener"); return; }
  if(a==="plano"){ PL_FAZ=c.fazendas[fi].nome; PL_FILTRO="abertos"; ABA="plano"; render(); return; }
  CAMPO={ fi:fi, modo:(a==="pauta"?"pauta":"campo"), dados:null, carregando:true, erro:"" }; ABA="campo"; render(); window.scrollTo(0,0);
  carregarCampo(c.fazendas[fi], MES).then(function(d){ CAMPO.dados=d; CAMPO.carregando=false; if(ABA==="campo") render(); })
    .catch(function(e){ CAMPO.erro=e.message; CAMPO.carregando=false; if(ABA==="campo") render(); });
}
function fimMes(m){ var p=m.split("-"), d=new Date(+p[0],+p[1],0); var f=isoDe(d); return f>hoje()?hoje():f; }
async function carregarCampo(f,mes){
  var ini=mes+"-01", fim=fimMes(mes), q="&token=&fazenda="+encodeURIComponent(f.nome), out={ ini:ini, fim:fim, avisos:[] };
  var noPer=function(dt){ dt=String(dt||"").slice(0,10); return dt>=ini && dt<=fim; };
  var canon=function(x){ return String(x||"").replace(/\s*\(\d+\s*animais\)\s*$/i,"").trim(); };
  var numLote=function(x){ return parseInt((String(x||"").match(/\d+/)||[9999])[0],10); };
  var tarefas=[];
  // app da fazenda
  tarefas.push((f.app?jsonp(f.app+"?acao=carregar",45000):Promise.reject(new Error("sem endereço do app"))).then(function(data){
    var S=null; if(data&&data.CONFIG&&data.CONFIG.length&&data.CONFIG[0]&&data.CONFIG[0][1]){ try{ S=JSON.parse(data.CONFIG[0][1]); }catch(e){} } else if(data&&(data.rT!==undefined||data.EST!==undefined)) S=data;
    if(!S) throw new Error("app não respondeu com dados");
    var rT=(S.rT||[]).filter(function(r){ return r&&!r._apagado; });
    // consumo no mês por lote+produto
    var cm={}; rT.forEach(function(r){ if(r.tipo!=="trato"||!noPer(r.dt)) return; var lo=canon(r.co||r.lote||""), pr=r.pr||r.prod||""; var k=lo+"||"+pr;
      if(!cm[k]) cm[k]={lote:lo,prod:pr,sacos:0}; cm[k].sacos+=(parseFloat(r.q||r.qtd)||0); });
    out.consumo=Object.keys(cm).map(function(k){ return cm[k]; }).sort(function(a,b){ return numLote(a.lote)-numLote(b.lote); });
    // pasto atual de cada lote + dias no pasto
    var ult={}, mud=[]; rT.forEach(function(r){ if(r.tipo!=="mudanca_pasto") return; var ln=canon(r.lote), dt=r.dt||"";
      if(ln&&(!ult[ln]||dt>ult[ln].dt)) ult[ln]={dt:dt,destino:r.destino||""}; if(noPer(dt)) mud.push({lote:ln,de:r.origem||"",para:r.destino||"",dt:dt}); });
    out.mudancas=mud.sort(function(a,b){ return b.dt.localeCompare(a.dt); });
    out.lotes=(S.LOTES||[]).filter(function(l){ return (l.qtd||0)>0; }).sort(function(a,b){ return numLote(a.nome)-numLote(b.nome); }).map(function(l){
      var m=ult[canon(l.nome)], dias=m&&m.dt?Math.max(0,difDias(m.dt,hoje())):null; return { lote:l.nome, cab:l.qtd, pasto:(m&&m.destino)||l.pasto||"—", dias:dias }; });
    // estoque atual (saldo e dias que cobre pela média de 7 dias)
    var lim7=isoDe(new Date(Date.now()-7*864e5)), trat={}, s7={};
    rT.forEach(function(r){ if(r.tipo!=="trato") return; var p=r.pr||r.prod||"", qq=parseFloat(r.q||r.qtd)||0; trat[p]=(trat[p]||0)+qq; if((r.dt||"")>=lim7) s7[p]=(s7[p]||0)+qq; });
    out.estoque=Object.keys(S.EST||{}).map(function(p){ var sd=(parseFloat((S.EST[p]||{}).q)||0)-(trat[p]||0), spd=(s7[p]||0)/7;
      return { produto:p, saldo:Math.round(sd*10)/10, dias:spd>0?Math.floor(sd/spd):null }; }).sort(function(a,b){ return (a.dias==null?99999:a.dias)-(b.dias==null?99999:b.dias); });
    // feno (saldo e rolos no mês)
    var fq={}; (S.mFeno||[]).forEach(function(m){ if(m&&m.mov==="saida"&&noPer(m.dt)) fq[m.tipo]=(fq[m.tipo]||0)+(parseFloat(m.q)||0); });
    out.feno=Object.keys(S.FENO||{}).map(function(t){ var e=S.FENO[t]||{}; return { tipo:t, saldo:(e.q!=null?e.q:0), u:e.u||"rolo", mes:fq[t]||0 }; });
    // diárias e despesas no mês
    var di=0, dv=0, de=0; (S.rD||[]).forEach(function(r){ if(!r||r._apagado||r.tipo!=="diaria"||!noPer(r.dt)) return; di++; dv+=parseFloat(r.v)||0; });
    (S.rDesp||[]).forEach(function(r){ if(!r||r._apagado||!noPer(r.dt)) return; de+=parseFloat(r.val)||0; });
    out.diarias={ n:di, valor:dv }; out.despesas=de;
    var st=[]; rT.forEach(function(r){ if(r.tipo==="sem_trato"&&noPer(r.dt)) st.push(canon(r.lote)); }); out.semTrato=st;
  }).catch(function(e){ out.avisos.push("App da fazenda: "+e.message); }));
  // pesagem: GMD por lote nas pesagens do mês
  tarefas.push((f.pesagem?jsonp(f.pesagem+"?acao=pesagem_todas"+q,45000):Promise.reject(new Error("sem endereço"))).then(function(r){
    var P=(r&&r.pesagens)||{}, datas=Object.keys(P).sort(), noMes=datas.filter(noPer), por={};
    noMes.forEach(function(d){ P[d].forEach(function(a){ if(a.lote==null||a.peso==null) return; var k=String(a.lote); if(!por[k]) por[k]={n:0,peso:0,g:0,ng:0,datas:{}};
      por[k].n++; por[k].peso+=a.peso; por[k].datas[d]=1; if(a.gmd!=null&&!isNaN(a.gmd)){ por[k].g+=a.gmd; por[k].ng++; } }); });
    out.pesagem=Object.keys(por).sort(function(a,b){ return a-b; }).map(function(k){ var x=por[k];
      return { lote:k, n:x.n, peso:x.peso/x.n, gmd:x.ng?x.g/x.ng:null, ng:x.ng, datas:Object.keys(x.datas) }; });
    out.ultPesagem=datas.length?datas[datas.length-1]:"";
  }).catch(function(e){ out.avisos.push("Pesagem: "+e.message); }));
  // manejos do vaqueiro no mês
  tarefas.push((f.pesagem?jsonp(f.pesagem+"?acao=manejo_ler"+q,30000):Promise.reject(new Error("sem endereço"))).then(function(r){
    var g={}; ((r&&r.itens)||[]).forEach(function(i){ if(!noPer(i.data)) return; if(String(i.situacao).toUpperCase()==="DESFEITO") return;
      if(!g[i.id]) g[i.id]={data:i.data,tarefas:i.tarefas,n:0}; g[i.id].n++; });
    out.manejos=Object.keys(g).map(function(k){ return g[k]; }).sort(function(a,b){ return a.data.localeCompare(b.data); });
  }).catch(function(e){ out.avisos.push("Manejo: "+e.message); }));
  await Promise.all(tarefas);
  return out;
}
var LOTE_NOME_C={"11":"Vaca","12":"Reprodutor","13":"Bezerro mamando","14":"Enfermaria","15":"Compra","16":"Novilha"};
function brd(iso){ return iso?iso.split("-").reverse().slice(0,2).join("/"):""; }
function relCampoHTML(d,faz,modo){
  var sec=function(t,corpo){ return '<div class="rsec"><h3>'+t+'</h3>'+corpo+'</div>'; };
  var tab=function(cab,linhas){ return linhas.length?'<table><tr>'+cab.map(function(c){ return '<th>'+c+'</th>'; }).join("")+'</tr>'+linhas.map(function(l){ return '<tr>'+l.map(function(c){ return '<td>'+c+'</td>'; }).join("")+'</tr>'; }).join("")+'</table>':'<p class="vz">Sem registro no período.</p>'; };
  var h='';
  if(d.avisos&&d.avisos.length) h+='<p class="av">Não deu pra ler: '+d.avisos.map(esc).join(" · ")+'</p>';
  if(d.lotes) h+=sec("Pastagem — onde está cada lote (hoje)", tab(["Lote","Cab.","Pasto","Dias no pasto"], d.lotes.map(function(l){ return [esc(l.lote), l.cab, esc(l.pasto), l.dias==null?"—":(l.dias>=35?'<b class="al">'+l.dias+'</b>':l.dias)]; })))
    +(d.mudancas&&d.mudancas.length?'<p class="sub">Mudanças no mês: '+d.mudancas.map(function(m){ return esc(m.lote)+' '+brd(m.dt)+' → '+esc(m.para); }).join(" · ")+'</p>':'');
  if(d.consumo) h+=sec("Insumo — consumo no mês (sacos)", tab(["Lote","Produto","Sacos"], d.consumo.map(function(c){ return [esc(c.lote), esc(c.prod), fmt(c.sacos,1)]; })))
    +(d.semTrato&&d.semTrato.length?'<p class="sub">Dias sem trato: '+d.semTrato.length+'</p>':'');
  if(d.estoque) h+=sec("Estoque — quanto dura (hoje)", tab(["Produto","Saldo","Dura"], d.estoque.map(function(e){ return [esc(e.produto), fmt(e.saldo,1), e.dias==null?"sem consumo":(e.dias<=15?'<b class="al">'+e.dias+' dias · programar compra</b>':e.dias+' dias')]; })))
    +(d.feno&&d.feno.length?'<p class="sub">Feno: '+d.feno.map(function(x){ return esc(x.tipo)+' saldo '+fmt(x.saldo)+' '+esc(x.u)+'(s), '+fmt(x.mes)+' no mês'; }).join(" · ")+'</p>':'');
  if(d.pesagem) h+=sec("Pesagem — GMD por lote no mês", d.pesagem.length?tab(["Lote","Pesados","Peso médio","GMD"], d.pesagem.map(function(x){ return [esc(LOTE_NOME_C[x.lote]||("Lote "+x.lote)), x.n, fmt(x.peso,0)+" kg", x.gmd==null?"—":fmt(x.gmd,3)+" kg/dia <span class=\"sub\">("+x.ng+" c/ GMD)</span>"]; }))
    :'<p class="vz">Sem pesagem no mês'+(d.ultPesagem?' — última em '+d.ultPesagem.split("-").reverse().join("/"):'')+'.</p>');
  if(d.manejos) h+=sec("Manejos do vaqueiro", tab(["Data","O que foi feito","Animais"], d.manejos.map(function(m){ return [brd(m.data), esc(m.tarefas), m.n]; })));
  if(d.diarias) h+=sec("Mão de obra e despesas no mês", '<p>'+d.diarias.n+' diária(s) · R$ '+fmt(d.diarias.valor,2)+(d.despesas?' · despesas lançadas no app R$ '+fmt(d.despesas,2):'')+'</p>');
  if(modo==="pauta"){
    var ab=D.plano.filter(function(p){ return p.fazenda===faz && p.situacao!=="feito"; }).sort(function(a,b){ return (a.prazo||"9999").localeCompare(b.prazo||"9999"); });
    h+=sec("Plano de ação em aberto", tab(["Ação","Responsável","Prazo"], ab.map(function(p){ var atr=p.prazo&&p.prazo<hoje(); return [esc(p.acao), esc(p.resp||""), p.prazo?(atr?'<b class="al">'+brd(p.prazo)+' (atrasada)</b>':brd(p.prazo)):""]; })))
      +sec("Combinados desta reunião", '<div class="linhas"></div><div class="linhas"></div><div class="linhas"></div><div class="linhas"></div>');
  }
  return h;
}

var CP={ faz:"", dados:null, obs:"" };
function idCP(faz,mes){ return "cp|"+faz+"|"+mes; }
function cpAgenda(faz,mes){ return D.agenda.filter(function(a){ return a.id===idCP(faz,mes); })[0]; }
/* cria o lembrete do dia 01 de cada fazenda (só se ainda não existe) */
async function garantirLembretesCP(){
  var mes=hoje().slice(0,7), novos=[];
  cfg().fazendas.forEach(function(f){ if(!cpAgenda(f.nome,mes)) novos.push({ id:idCP(f.nome,mes), data:mes+"-01", hora:"", titulo:"Enviar contas a pagar ao dono", fazenda:f.nome, tipo:"compromisso", origem:"auto-cp", feito:false }); });
  if(!novos.length) return;
  try{ await centralPost("agenda_salvar",{itens:novos}); D.agenda=D.agenda.concat(novos); render(); }catch(e){}
}
async function cpEnviado(faz,v){
  var mes=MES, a=cpAgenda(faz,mes);
  if(!a){ a={ id:idCP(faz,mes), data:mes+"-01", hora:"", titulo:"Enviar contas a pagar ao dono", fazenda:faz, tipo:"compromisso", origem:"auto-cp", feito:false }; D.agenda.push(a); }
  var ant=a.feito, antObs=a.obs, n=new Date();
  a.feito=v; a.obs=v?("enviado em "+String(n.getDate()).padStart(2,"0")+"/"+String(n.getMonth()+1).padStart(2,"0")+"/"+n.getFullYear()+" às "+String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0")):"";
  render();
  try{ await centralPost("agenda_salvar",{itens:[a]}); }catch(e){ a.feito=ant; a.obs=antObs; render(); alert("Não salvou: "+e.message); }
}
function cpLinha(f,fi){
  var a=cpAgenda(f.nome,MES), ok=a&&a.feito, atras=!ok && MES<=hoje().slice(0,7) && (MES+"-01")<hoje();

  var et=($("cEt")?$("cEt").value:"").split("\n").map(function(x){ return x.trim(); }).filter(Boolean); if(et.length) c.rotinaMes=et;
  if($("cEtT")) c.rotinaTri=$("cEtT").value.split("\n").map(function(x){ return x.trim(); }).filter(Boolean);
  c.fazendas=c.fazendas.map(function(f,i){ var mt=$("fT"+i+"_1")?MES_AB.map(function(m,k){ return $("fT"+i+"_"+(k+1)).checked?k+1:0; }).filter(Boolean):(f.mesesTri||[]);
    return { nome:($("fN"+i)?$("fN"+i).value.trim():f.nome), pesagem:($("fP"+i)?$("fP"+i).value.trim():f.pesagem), app:($("fA"+i)?$("fA"+i).value.trim():f.app), mesesTri:mt }; }).filter(function(f){ return f.nome; });
  return c;
}
async function salvarAjustes(){
  var c=lerAjustes(cfg()), m=$("cMsg"); m.textContent="Salvando…"; m.style.color="";
  try{ await centralPost("config_salvar",{config:c}); L.config=c; salvarL(); m.textContent="Salvo."; m.style.color="var(--v1)"; carregarTudo(); }
  catch(e){ m.textContent="Não salvou: "+e.message; m.style.color="var(--danger)"; }
}

/* ---------- abrir ---------- */
(function(){
  if(L.cache && L.cache.dia===hoje()){ D.agenda=L.cache.agenda||[]; D.rotina=L.cache.rotina||[]; D.plano=L.cache.plano||[]; D.quando=L.cache.quando; }
  render();
  if(L.url && L.senha){ $("topSub").textContent=D.quando?"atualizado "+D.quando:""; carregarTudo(); }
})();
</script>
