<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal — Gestão Pecuária Lucrativa</title>
<style>
:root{--v1:#1B5E20;--v2:#2E7D32;--v7:#E8F5E9;--line:#d8e0d8;--muted:#5f6b60;--bg:#f4f7f4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#1a1a1a}
.top{background:linear-gradient(135deg,var(--v1),var(--v2));color:#fff;padding:16px 18px;display:flex;align-items:center;gap:12px}
.top img{height:44px}
.top .t{font-size:17px;font-weight:800}
.top .s{font-size:12px;opacity:.9}
.top .out{margin-left:auto;background:rgba(255,255,255,.18);border:none;color:#fff;padding:8px 12px;border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.hi{font-size:14px;color:var(--muted);margin:6px 2px 16px}
.hi b{color:var(--v1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.tool{background:#fff;border-radius:14px;padding:18px;text-decoration:none;color:inherit;box-shadow:0 1px 3px rgba(0,0,0,.07);border:1px solid #eef2ee;display:flex;flex-direction:column;gap:8px;transition:transform .1s}
.tool:active{transform:scale(.98)}
.tool .ic{width:44px;height:44px;border-radius:11px;background:var(--v7);color:var(--v1);display:flex;align-items:center;justify-content:center}
.tool .nm{font-weight:800;color:var(--v1);font-size:15px}
.tool .ds{font-size:12px;color:var(--muted)}
.empty{background:#fff;border-radius:12px;padding:30px;text-align:center;color:var(--muted)}
</style></head><body>

function sair(){ try{localStorage.removeItem("gpl_cliente_auth")}catch(e){} location.href="login.html"; }
(function(){
  var a=null; try{ a=JSON.parse(localStorage.getItem("gpl_cliente_auth")||"null"); }catch(e){}
  if(!a || !a.token){ location.href="login.html"; return; }
  document.getElementById("sub").textContent=a.fazenda||"Área do cliente";
  document.getElementById("hi").innerHTML="Olá"+(a.cliente?", <b>"+a.cliente+"</b>":"")+" — você está vendo os dados de <b>"+(a.fazenda||"")+"</b>.";
  var ferr=(a.ferramentas&&a.ferramentas.length)?a.ferramentas:["pesagem","analise","efetivo"];
  var g=document.getElementById("grid"), n=0;
  ferr.forEach(function(k){
    var t=TOOLS[k]; if(!t) return; n++;
    var el=document.createElement("a"); el.className="tool"; el.href=t.url;
    el.innerHTML='<div class="ic">'+t.ic+'</div><div class="nm">'+t.nm+'</div><div class="ds">'+t.ds+'</div>';
    g.appendChild(el);
  });

})();
