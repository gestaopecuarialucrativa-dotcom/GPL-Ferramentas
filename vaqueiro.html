<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#123d1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GPL Vaqueiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="icone-caixa-gpl.png">
<link rel="icon" type="image/png" href="icone-caixa-gpl.png">
<style>
:root{--v1:#1B5E20;--v2:#2E7D32;--v3:#4CAF50;--v7:#E8F5E9;--bg:#f3f6f2;--line:#e6ebe5;--ink:#16261a;--muted:#7a8a7e;--warn:#8a5a00;--danger:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}
/* cabeçalho no padrão novo (Raio-X) */
.top{background:linear-gradient(140deg,#123d1d,#1f6b33 70%,#3f8f3a);color:#fff;padding:16px 18px 18px;position:relative}
.top .lg{height:30px;filter:brightness(0) invert(1);opacity:.95;display:block}
.top small{display:block;color:#b9dcbf;font-size:11px;letter-spacing:.6px;font-weight:700;margin-top:12px;text-transform:uppercase}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px;margin:2px 0 0}
.top .volta{position:absolute;right:14px;top:14px;background:rgba(255,255,255,.16);color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;font-size:12px;text-decoration:none}
.st{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.16);white-space:nowrap}
.st.off{background:#fff2dc;color:var(--warn)}
.abas{display:flex;gap:6px;padding:10px 12px 0;max-width:560px;margin:0 auto}
.aba{flex:1;text-align:center;padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.aba.on{background:var(--v7);border-color:var(--v3);color:var(--v1)}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 90px}
.c{background:#fff;border:none;border-left:4px solid #2E7D32;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.lbl{font-size:11px;font-weight:800;color:var(--v1);letter-spacing:.6px;text-transform:uppercase;margin:0 0 6px}
select,input,textarea{font:inherit;font-size:16px;width:100%;padding:10px 11px;border:1.5px solid #cbd6ca;border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:80px;resize:vertical;line-height:1.45}
.big{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bb{border:1.5px dashed #9fbf98;background:#f0f6ee;border-radius:12px;padding:16px 6px;text-align:center;font-size:14px;font-weight:800;color:var(--v1);cursor:pointer;user-select:none}
.bb svg{display:block;margin:0 auto 5px}
.bb.rec{background:#fdecea;border-color:#e57373;color:var(--danger)}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.th{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;background:#dde5dc}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:13px;line-height:22px;padding:0;cursor:pointer}
.au{display:flex;align-items:center;gap:8px;background:#f3f6f2;border-radius:10px;padding:6px 8px;margin-top:8px;font-size:13px}
.au audio{flex:1;height:34px;min-width:0}
.au button,.lk{border:0;background:none;color:var(--muted);font-size:12.5px;cursor:pointer;padding:4px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:15px;text-align:center;background:var(--v2);color:#fff;cursor:pointer}
.btn:disabled{opacity:.5}
.mini{font-size:12px;color:var(--muted)}
.msg{font-size:13px;font-weight:700;margin-top:8px;text-align:center}
.it{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #eef2ed;cursor:pointer}
.it:last-child{border:0}
.it .tx{flex:1;min-width:0;font-size:14px}
.it .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .mi{width:48px;height:48px;border-radius:9px;overflow:hidden;background:#dde5dc;flex:none}
.it .mi img{width:100%;height:100%;object-fit:cover}
.tag{border-radius:7px;padding:2px 8px;font-size:11.5px;font-weight:700;white-space:nowrap;align-self:flex-start}
.t1{background:#fff2dc;color:var(--warn)}.t2{background:var(--v7);color:var(--v1)}.t3{background:#e4eefb;color:#1d4f91}
.vazio{padding:16px 4px;color:var(--muted);font-size:14px;text-align:center}
.det img{width:100%;border-radius:10px;margin-bottom:8px;display:block}
.t4{background:#eceff1;color:#546e7a}
</style>
</head>

  try{
    for(var i=0;i<ENVIOS.length;i++){ var n=ENVIOS[i]; if(n.subiu) continue; n.arq=n.arq||{}; var fs=[], uf=[], ua=[];
      (n.fotos||[]).forEach(function(b,k){ fs.push({ nome:n.id+"-foto-"+(k+1)+".jpg", tipo:b.type||"image/jpeg", b:b, foto:true }); });
      (n.audios||[]).forEach(function(a,k){ var tp=(a.blob.type||"audio/webm").split(";")[0]; fs.push({ nome:n.id+"-audio-"+(k+1)+"."+extAudio(tp), tipo:tp, b:a.blob }); });
      for(var k=0;k<fs.length;k++){ var f=fs[k];
        if(!n.arq[f.nome]){ var j=await post("vaq_arquivo",{ nome:f.nome, tipo:f.tipo, b64:await b64De(f.b) }); n.arq[f.nome]=j.url; await salvar("envios",n); }
        (f.foto?uf:ua).push(n.arq[f.nome]); }
      var q=new Date(n.criado);
      await post("vaq_enviar",{ item:{ id:n.id, criado:q.getFullYear()+"-"+pad2(q.getMonth()+1)+"-"+pad2(q.getDate())+" "+pad2(q.getHours())+":"+pad2(q.getMinutes()), texto:n.texto, fotos:uf.join("\n"), audios:ua.join("\n") } });
      n.subiu=true; await salvar("envios",n); }
    for(var m=0;m<FEITOS.length;m++){ var fe=FEITOS[m], url="";
      if(fe.fotos&&fe.fotos[0]){ var jf=await post("vaq_arquivo",{ nome:"feito-"+fe.id+".jpg", tipo:"image/jpeg", b64:await b64De(fe.fotos[0]) }); url=jf.url; }
      await post("vaq_feito",{ id:fe.id, foto:url, obs:fe.obs||"" }); await apagarDe("feitos",fe.id); }
    ERRO_LINK="";
  }catch(e){ if(!e.semRede) ERRO_LINK=String(e.message||e); }
  SINC=false; await carregar(); await buscarInfo(); render();
}
/* ---------- o que o Rogério respondeu e as tarefas ---------- */
async function buscarInfo(){
  if(!TOKEN||!navigator.onLine) return;
  try{ var r=await fetch(URL_CENTRAL+"?acao=vaq_info&token="+encodeURIComponent(TOKEN)+"&t="+Date.now(),{credentials:"omit"}); var j=JSON.parse(await r.text());
    if(!j.ok){ ERRO_LINK=j.msg||"link com problema"; return; }
    INFO={ nome:j.nome, fazenda:j.fazenda, tarefas:j.tarefas||[], envios:j.envios||[], quando:new Date().toISOString() };
    try{ localStorage.setItem("gpl_vaq_info",JSON.stringify(INFO)); }catch(e){}
  }catch(e){}
}
function respostaDe(id){ return ((INFO.envios||[]).filter(function(x){ return x.id===id; })[0])||null; }

/* ---------- feito ---------- */
var FZFOTO=null;
function abrirFeito(id){ FZ=id; FZFOTO=null; render(); }
function fotoFeito(){ pegarFoto(function(b){ FZFOTO=b; render(); }); }
async function confirmarFeito(){
  var obs=(($("fobs")||{}).value||"").trim();
  try{ await salvar("feitos",{ id:FZ, criado:new Date().toISOString(), obs:obs, fotos:FZFOTO?[FZFOTO]:[], audios:[] }); }catch(e){ alert("Não guardou: "+(e.message||e)); return; }
  FZ=null; FZFOTO=null; await carregar(); render(); sincronizar();
}

/* ---------- telas ---------- */
function telaMandar(){
  var h='<div class="c"><div class="big"><div class="bb" onclick="tirarFoto()">'+ICAM+'Foto</div>'
    +'<div class="bb'+(REC?' rec':'')+'" onclick="gravar()">'+(REC?ISTOP+'Parar · <span id="recT">0:00</span>':IMIC+'Gravar áudio')+'</div></div>';
  if(NOVA.fotos.length) h+='<div class="thumbs">'+NOVA.fotos.map(function(b,i){ return '<div class="th"><img src="'+urlDe(b)+'" alt=""><button onclick="NOVA.fotos.splice('+i+',1);render()" aria-label="tirar foto">×</button></div>'; }).join("")+'</div>';
  NOVA.audios.forEach(function(a,i){ h+='<div class="au"><audio controls src="'+urlDe(a.blob)+'"></audio><span class="mini">'+seg(a.dur)+'</span><button onclick="NOVA.audios.splice('+i+',1);render()">apagar</button></div>'; });
  h+='</div><div class="c"><div class="lbl">O que você viu <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted)">· pode falar no microfone do teclado</span></div><textarea id="tx" placeholder="ex.: cerca caída no módulo 3, perto da porteira" oninput="NOVA.texto=this.value">'+esc(NOVA.texto)+'</textarea></div>'
    +'<button class="btn" onclick="mandar()">Mandar pro Rogério</button><div class="mini" style="text-align:center;margin-top:6px">funciona sem sinal · vai sozinho quando pegar rede</div><div class="msg" id="msg"></div>';
  if(ENVIOS.length){ h+='<div class="lbl" style="margin:18px 2px 8px">O que você mandou</div><div class="c">'+ENVIOS.slice(0,15).map(function(n){
      var r=respostaDe(n.id), tag;
      if(!n.subiu) tag='<span class="tag t1">no celular</span>';
      else if(r&&r.situacao==="vai fazer") tag='<span class="tag t2">vai fazer'+(r.prazo?' · até '+dm(r.prazo):'')+'</span>';
      else if(r&&r.situacao==="não fazer") tag='<span class="tag t4">não precisa</span>';
      else tag='<span class="tag t3">chegou ✓</span>';
      var tit=n.texto||((n.fotos.length?n.fotos.length+" foto"+(n.fotos.length>1?"s":""):"")+(n.audios.length?(n.fotos.length?" · ":"")+"áudio":""));
      return '<div class="it" style="cursor:default">'+(n.fotos[0]?'<div class="mi"><img src="'+urlDe(n.fotos[0])+'" alt=""></div>':'')+'<div class="tx"><b>'+esc(tit)+'</b><span class="mini">'+dataHora(n.criado)+(r&&r.resposta?' · Rogério: '+esc(r.resposta):'')+'</span></div>'+tag+'</div>'; }).join("")+'</div>'; }
  return h;
}
function telaTarefas(){
  if(FZ) return telaFeito();
  var L=(INFO.tarefas||[]), pend={}; FEITOS.forEach(function(f){ pend[f.id]=1; });
  var abertas=L.filter(function(t){ return t.situacao!=="feito"&&t.situacao!=="conferir"&&!pend[t.id]; }).sort(function(a,b){ return String(a.prazo||"9").localeCompare(String(b.prazo||"9")); });
  var feitas=L.filter(function(t){ return t.situacao==="feito"||t.situacao==="conferir"||pend[t.id]; });
  var hj=hojeISO(), h='';
  if(!abertas.length) h+='<div class="c"><div class="vazio">Nenhuma tarefa pra fazer agora. 👍</div></div>';
  else h+='<div class="c">'+abertas.map(function(t){ var atr=t.prazo&&t.prazo<hj, hoje=t.prazo===hj;
      return '<div class="it" style="cursor:default;align-items:center"><div class="tx"><b style="white-space:normal">'+esc(t.acao)+'</b><span class="mini" style="'+(atr?'color:var(--danger);font-weight:700':'')+'">'+(t.prazo?(atr?'atrasada · era até '+dm(t.prazo):(hoje?'é pra hoje':'até '+dm(t.prazo))):'sem prazo')+'</span></div>'
        +'<button class="btn" style="width:auto;padding:10px 14px;font-size:14px" onclick="abrirFeito(\''+esc(t.id)+'\')">Feito</button></div>'; }).join("")+'</div>';
  if(feitas.length) h+='<div class="lbl" style="margin:18px 2px 8px">Feitas</div><div class="c">'+feitas.map(function(t){ var tag=pend[t.id]?'<span class="tag t1">no celular</span>':(t.situacao==="conferir"?'<span class="tag t3">Rogério vai conferir</span>':'<span class="tag t2">conferido ✓</span>');
      return '<div class="it" style="cursor:default"><div class="tx"><b style="white-space:normal">'+esc(t.acao)+'</b></div>'+tag+'</div>'; }).join("")+'</div>';
  h+='<div class="mini" style="text-align:center">'+(INFO.quando?'atualizado '+dataHora(INFO.quando):'')+(navigator.onLine?' · <button class="lk" onclick="sincronizar()">atualizar</button>':' · sem sinal')+'</div>';
  return h;
}
function telaFeito(){
  var t=(INFO.tarefas||[]).filter(function(x){ return x.id===FZ; })[0]; if(!t){ FZ=null; return telaTarefas(); }
  return '<div class="c det"><button class="lk" onclick="FZ=null;render()">‹ voltar</button><div style="font-size:17px;font-weight:800;margin:6px 0 12px">'+esc(t.acao)+'</div>'
    +'<div class="lbl">Foto do serviço pronto <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted)">· se puder</span></div>'
    +(FZFOTO?'<img src="'+urlDe(FZFOTO)+'" alt=""><button class="lk" onclick="FZFOTO=null;render()">tirar foto</button>':'<div class="bb" style="margin-bottom:8px" onclick="fotoFeito()">'+ICAM+'Tirar foto</div>')
    +'<div class="lbl" style="margin-top:10px">Recado <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted)">· se quiser</span></div><textarea id="fobs" placeholder="ex.: troquei 3 lascas, faltou arame"></textarea>'
    +'<button class="btn" style="margin-top:12px" onclick="confirmarFeito()">Confirmar: está feito</button></div>';
}
function render(){ limparURLs();
  var nt=(INFO.tarefas||[]).filter(function(t){ return t.situacao!=="feito"&&t.situacao!=="conferir"; }).length;
  $("abM").className="aba"+(ABA==="mandar"?" on":""); $("abT").className="aba"+(ABA==="tarefas"?" on":""); $("nT").textContent=nt?"("+nt+")":"";
  $("ola").textContent=INFO.nome?"Olá, "+String(INFO.nome).split(" ")[0]:"Campo do vaqueiro"; $("kick").textContent=INFO.fazenda||"GPL · campo";
  var pend=ENVIOS.filter(function(n){ return !n.subiu; }).length+FEITOS.length, st=$("st");
  st.className="st"+(navigator.onLine?"":" off"); st.textContent=(navigator.onLine?"com sinal":"sem sinal")+(pend?" · "+pend+" esperando sinal":"");
  if(!TOKEN){ $("app").innerHTML='<div class="c"><div class="vazio">Este link está incompleto. Peça pro Rogério mandar o seu link de novo pelo WhatsApp.</div></div>'; return; }
  var h=ERRO_LINK?'<div class="c" style="border-left-color:var(--danger)"><div class="mini" style="color:var(--danger);font-weight:700">'+esc(ERRO_LINK)+'</div></div>':'';
  $("app").innerHTML=h+(ABA==="mandar"?telaMandar():telaTarefas());
}
function aba(a){ ABA=a; FZ=null; render(); window.scrollTo(0,0); if(a==="tarefas"&&navigator.onLine) buscarInfo().then(render); }
async function carregar(){ ENVIOS=await todos("envios"); FEITOS=await todos("feitos"); }
window.addEventListener("online",function(){ render(); sincronizar(); }); window.addEventListener("offline",render);
(async function(){
  try{ await abrirDB(); await carregar(); }catch(e){ $("app").innerHTML='<div class="c">Este navegador não deixou guardar dados no celular: '+esc(e.message||e)+'</div>'; return; }
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  render(); await buscarInfo(); render(); sincronizar();
})();

/* abrir sem internet (só esta página) */
if("serviceWorker" in navigator){ window.addEventListener("load", function(){ navigator.serviceWorker.register("sw-vaqueiro.js",{scope:"./vaqueiro"}).catch(function(){}); }); }
</script>
